  <script>
    // ✅ NEW ID
    const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4";
    const apiRoot = `https://opensheet.elk.sh/${sheetID}`;
    let allReviewsData = [];

    document.addEventListener("DOMContentLoaded", () => {
        fetch(`${apiRoot}/Reviews`)
        .then(res => res.json())
        .then(data => {
            allReviewsData = data.sort(() => 0.5 - Math.random());
            renderReviews(allReviewsData);
        })
        .catch(err => {
            document.getElementById('all-reviews-container').innerHTML = "<p style='text-align:center; padding:20px;'>Failed to load reviews.</p>";
        });
    });

    function renderReviews(data) {
        const container = document.getElementById('all-reviews-container');
        container.innerHTML = "";

        if(data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#999; padding:20px;'>No reviews found.</p>";
            return;
        }

        data.forEach(r => {
            const stars = parseInt(r.stars || r.Stars) || 5;
            const starString = "⭐".repeat(stars);
            let img = r.image || r.Image || "person.png";
            if(!img.startsWith('http')) img = `../img/${img}`;

            const name = r.name || r.Name || "Student";
            const review = r.review || r.Review || "";

            container.innerHTML += `
            <div class="review-card" style="width: 100%;"> 
                <div class="review-header">
                    <img src="${img}" class="review-img" alt="User" onerror="this.src='../img/person.png'">
                    <div>
                        <div class="review-name">${name}</div>
                        <div class="stars">${starString}</div>
                    </div>
                </div>
                <div class="review-text">"${review}"</div>
            </div>`;
        });
    }

    function filterReviews(rating, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        let filtered = [];
        if(rating === 'all') {
            filtered = allReviewsData;
        } else {
            filtered = allReviewsData.filter(r => parseInt(r.stars || r.Stars) === parseInt(rating));
        }
        renderReviews(filtered);
    }
</script>
