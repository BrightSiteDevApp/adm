    <style>
        /* --- MODAL & REVIEW STYLES --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #777;
        }
        .star-rating-input {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .star-rating-input i {
            font-size: 24px;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-rating-input i.active {
            color: #FFD700;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: none;
            height: 100px;
            font-family: inherit;
            margin-top: 10px;
        }
        .submit-btn {
            width: 100%;
            background: var(--primary-blue, #007bff);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 20px;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .pending-tag {
            background: #ffeeba;
            color: #856404;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 10px;
            font-weight: bold;
            vertical-align: middle;
        }
    </style>
</head>

  <script src="../asset/script.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ✅ YOUR CONFIGURATION
    const firebaseConfig = {
        apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
        authDomain: "afit-market-auth.firebaseapp.com",
        projectId: "afit-market-auth",
        storageBucket: "afit-market-auth.firebasestorage.app",
        messagingSenderId: "894920886640",
        appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let allReviews = [];
    let selectedRating = 0;

    // Listen for Authentication State
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            console.log("User logged in:", user.displayName);
        } else {
            console.log("No user logged in");
        }
        // Always load reviews regardless of auth state
        loadReviews();
    });

    // --- MODAL FUNCTIONS ---
    window.openReviewModal = function() {
        if(!currentUser) {
            alert("Please sign in to write a review!");
            return;
        }
        // Check 2 review limit
        const myReviews = allReviews.filter(r => r.uid === currentUser.uid);
        if(myReviews.length >= 2) {
            alert("You have reached the limit of 2 reviews per account.");
            return;
        }
        document.getElementById('reviewModal').style.display = 'flex';
    }

    window.closeReviewModal = function() {
        document.getElementById('reviewModal').style.display = 'none';
        selectedRating = 0;
        updateStars();
        document.getElementById('reviewText').value = "";
        document.getElementById('reviewError').style.display = 'none';
    }

    // Star Click Logic
    document.querySelectorAll('#starInput i').forEach(star => {
        star.addEventListener('click', function() {
            selectedRating = parseInt(this.getAttribute('data-val'));
            updateStars();
        });
    });

    function updateStars() {
        document.querySelectorAll('#starInput i').forEach(star => {
            const val = parseInt(star.getAttribute('data-val'));
            if(val <= selectedRating) star.classList.add('active');
            else star.classList.remove('active');
        });
    }

    // --- SUBMIT LOGIC ---
    window.submitReview = async function() {
        const text = document.getElementById('reviewText').value;
        const errorMsg = document.getElementById('reviewError');
        
        if(selectedRating === 0) {
            errorMsg.innerText = "Please select a star rating.";
            errorMsg.style.display = 'block';
            return;
        }
        if(text.length < 5) {
            errorMsg.innerText = "Review text is too short.";
            errorMsg.style.display = 'block';
            return;
        }

        const submitBtn = document.querySelector('.submit-btn');
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;

        try {
            await addDoc(collection(db, "reviews"), {
                uid: currentUser.uid,
                name: currentUser.displayName || "Student",
                image: currentUser.photoURL || "../img/person.png",
                rating: selectedRating,
                review: text,
                status: "pending", // ⚠️ DEFAULT STATUS IS PENDING
                createdAt: serverTimestamp()
            });

            alert("Review submitted! It will appear as 'Pending' until approved.");
            closeReviewModal();
            loadReviews(); // Reload to show the new pending review
        } catch (e) {
            console.error("Error adding review: ", e);
            alert("Error submitting review. Please try again.");
        }
        
        submitBtn.innerText = "Submit Review";
        submitBtn.disabled = false;
    }

    // --- LOAD REVIEWS (Hybrid Logic) ---
    async function loadReviews() {
        const container = document.getElementById('all-reviews-container');
        
        try {
            const q = query(collection(db, "reviews"), orderBy("createdAt", "desc"));
            const snapshot = await getDocs(q);
            
            allReviews = [];
            
            snapshot.forEach(doc => {
                const data = doc.data();
                data.id = doc.id;
                
                // LOGIC: Show if Approved OR if it belongs to current user
                if (data.status === 'approved') {
                    allReviews.push(data);
                } else if (currentUser && data.uid === currentUser.uid) {
                    allReviews.push(data); // Show user their own pending review
                }
            });

            renderReviews(allReviews);

        } catch (e) {
            console.error("Error loading reviews:", e);
            // If the collection doesn't exist yet, just show empty
            if(e.code === 'permission-denied') {
                container.innerHTML = "<p style='text-align:center;'>Please setup Firestore Rules.</p>";
            } else {
                container.innerHTML = ""; // Clear skeletons if empty
                if(allReviews.length === 0) container.innerHTML = "<p style='text-align:center; color:#999; padding:20px;'>No reviews yet. Be the first!</p>";
            }
        }
    }

    window.renderReviews = function(data) {
        const container = document.getElementById('all-reviews-container');
        container.innerHTML = "";

        if(data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#999; padding:20px;'>No reviews yet. Be the first!</p>";
            return;
        }

        data.forEach(r => {
            const stars = r.rating;
            const starString = '<i class="fas fa-star" style="color:#FFD700;"></i>'.repeat(stars);
            
            // Check if pending
            let pendingBadge = "";
            if(r.status === 'pending') {
                pendingBadge = `<span class="pending-tag">PENDING</span>`;
            }

            container.innerHTML += `
            <div class="review-card" style="width: 100%;"> 
                <div class="review-header">
                    <img src="${r.image}" class="review-img" alt="User" onerror="this.src='../img/person.png'">
                    <div>
                        <div class="review-name">${r.name} ${pendingBadge}</div>
                        <div class="stars" style="font-size:10px;">${starString}</div>
                    </div>
                </div>
                <div class="review-text">"${r.review}"</div>
            </div>`;
        });
    }

    window.filterReviews = function(rating, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if(rating === 'all') {
            renderReviews(allReviews);
        } else {
            const filtered = allReviews.filter(r => r.rating == rating);
            renderReviews(filtered);
        }
    }
  </script>
