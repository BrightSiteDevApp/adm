<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
   
    <title>Student Reviews | AFIT Digital Market (ADM)</title>
    <meta name="description" content="Read real reviews from AFIT students.">
    <meta property="og:title" content="What Students Are Saying - AFIT Digital Market">
    <meta property="og:image" content="https://afitdgm.store/img/logo-blue.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="icon" href="../img/app-logo.png" type="image/png">

    <style>
        /* --- MODAL & REVIEW STYLES --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #777;
        }
        .star-rating-input {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .star-rating-input i {
            font-size: 28px;
            color: #eee;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .star-rating-input i:active { transform: scale(0.8); }
        .star-rating-input i.active { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 12px;
            resize: none;
            height: 120px;
            font-family: inherit;
            margin-top: 10px;
            background: #f9f9f9;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #2d8eff; background: white; }

        .submit-btn {
            width: 100%;
            background: var(--primary-blue, #007bff);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 30px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(45, 142, 255, 0.3);
        }
        .submit-btn:active { transform: scale(0.96); }

        .pending-tag {
            background: #ffeeba;
            color: #856404;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            margin-left: 5px;
            font-weight: bold;
            vertical-align: middle;
        }
        
        /* Review Date */
        .review-date { font-size: 10px; color: #aaa; margin-top: 2px; }

        /* User Action Buttons */
        .user-actions {
            display: flex;
            gap: 15px;
            margin-left: auto;
        }
        .action-icon { font-size: 14px; cursor: pointer; color: #ccc; transition: color 0.2s; }
        .action-icon:hover { color: var(--primary-blue, #007bff); }
        .action-delete:hover { color: #ff4757; }

        /* Skeletons */
        .sk-shimmer {
            background: #eee;
            background-image: linear-gradient(90deg, #eee, #f5f5f5, #eee);
            background-size: 200px 100%;
            animation: skeleton-loading 1.5s infinite linear;
        }
        @keyframes skeleton-loading {
            0% { background-position: -200px 0; }
            100% { background-position: calc(200px + 100%) 0; }
        }

        /* Dark Mode Fixes */
        body.dark-mode .modal-content { background: #1e1e1e; }
        body.dark-mode textarea { background: #2d3436; border-color: #444; color: white; }
        body.dark-mode .review-card { background: #1e1e1e; border-color: #333; }
        body.dark-mode .review-name { color: #eee; }
        body.dark-mode .review-text { color: #bbb; }
        body.dark-mode .sk-shimmer { background-color: #333; background-image: linear-gradient(90deg, #333, #444, #333); }
        .review-promo-box { background: #f9f9f9; }
        body.dark-mode .review-promo-box { background: #1e1e1e !important; }
        body.dark-mode .review-promo-box p { color: #ccc !important; }
        body.dark-mode #all-reviews-container > p { background: #1e1e1e !important; color: #ccc !important; border: 1px solid #333; }
    </style>
</head>
<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
  </script>

  <div class="app-container">
    
   <div class="header" style="position: relative;"> 
       <a href="../" class="back-btn"><i class="fas fa-arrow-left"></i></a>
       <div class="notification-icon-box" id="theme-toggle" style="position: absolute; right: 15px; top: 15px;">
        <i class="fas fa-moon"></i>
       </div>
    </div>

    <div class="content-page-wrapper">
        <h2 class="content-title">What Students Say</h2>
        <p style="color:#777; font-size:13px; margin-bottom:20px;">Real feedback from the AFIT community.</p>

        <div class="filter-scroll" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:15px; margin-bottom:10px; scrollbar-width: none;">
            <button class="filter-btn active" onclick="filterReviews('all', this)">All</button>
            <button class="filter-btn" onclick="filterReviews(5, this)">5 <i class="fas fa-star" style="color:#FFD700; font-size:10px;"></i></button>
            <button class="filter-btn" onclick="filterReviews(4, this)">4 <i class="fas fa-star" style="color:#FFD700; font-size:10px;"></i></button>
            <button class="filter-btn" onclick="filterReviews(3, this)">3 <i class="fas fa-star" style="color:#FFD700; font-size:10px;"></i></button>
            <button class="filter-btn" onclick="filterReviews(2, this)">2 <i class="fas fa-star" style="color:#FFD700; font-size:10px;"></i></button>
            <button class="filter-btn" onclick="filterReviews(1, this)">1 <i class="fas fa-star" style="color:#FFD700; font-size:10px;"></i></button>
        </div>

        <div id="all-reviews-container" style="display: flex; flex-direction: column; gap: 15px;">
            </div>
        
       <div class="review-promo-box" style="margin-top: 40px; text-align: center; padding: 20px; border-radius: 15px;">
            <div style="font-size: 40px; margin-bottom: 10px;">✍️</div>
            <p style="margin-bottom:15px; font-size:13px; color:#555; font-weight: bold;">Have an experience to share?</p>
            <button onclick="openReviewModal()" style="border:none; cursor:pointer; display:inline-block; padding:12px 30px; background:var(--primary-blue, #007bff); color:white; border-radius:30px; font-size:13px; font-weight:bold; box-shadow: 0 4px 10px rgba(0,123,255,0.3); transition: transform 0.2s;">Write a Review</button>
        </div>

    </div>

    <div id="reviewModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="closeReviewModal()">&times;</span>
            <h3 id="modalTitle" style="text-align:center; color: #333; margin-top: 10px;">Rate your experience</h3>
            
            <div class="star-rating-input" id="starInput">
                <i class="fas fa-star" data-val="1"></i>
                <i class="fas fa-star" data-val="2"></i>
                <i class="fas fa-star" data-val="3"></i>
                <i class="fas fa-star" data-val="4"></i>
                <i class="fas fa-star" data-val="5"></i>
            </div>
            
            <textarea id="reviewText" placeholder="Tell us what you bought and how the vendor treated you..."></textarea>
            <p id="reviewError" style="color:#ff4757; font-size:12px; text-align:center; display:none; margin-top:10px; font-weight: bold;"></p>
            <button class="submit-btn" onclick="submitReview()">Submit Review</button>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="../about-us/">About Us</a> | 
            <a href="../safety/">Safety Tips</a> | 
            <a href="../t&c/">T & C</a> | 
            <a href="../contact-us/">Contact</a>
        </div>
      <p style="margin-top:20px; color:#777; font-size: 12px;">
    &copy; 2026 All rights reserved. Powered by 
    <a href="https://brightsitedev.tech" target="_blank" style="color:#2d8eff; text-decoration:none; font-weight:bold;">Brightsitedev</a>
</p>
    </footer>

  </div>

  <script src="../asset/script.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
        authDomain: "afit-market-auth.firebaseapp.com",
        projectId: "afit-market-auth",
        storageBucket: "afit-market-auth.firebasestorage.app",
        messagingSenderId: "894920886640",
        appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let allReviews = [];
    let selectedRating = 0;
    let editingReviewId = null;

    // --- XSS PROTECTION ---
    function escapeHTML(str) {
        if (!str) return "";
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // --- FORMAT DATE ---
    function timeAgo(dateInput) {
        if (!dateInput) return "Recently";
        
        // Handle Firebase Timestamp or JS Date
        const date = dateInput.seconds ? new Date(dateInput.seconds * 1000) : new Date(dateInput);
        const seconds = Math.floor((new Date() - date) / 1000);

        let interval = seconds / 31536000;
        if (interval > 1) return Math.floor(interval) + " years ago";
        interval = seconds / 2592000;
        if (interval > 1) return Math.floor(interval) + " months ago";
        interval = seconds / 86400;
        if (interval > 1) return Math.floor(interval) + " days ago";
        interval = seconds / 3600;
        if (interval > 1) return Math.floor(interval) + " hours ago";
        interval = seconds / 60;
        if (interval > 1) return Math.floor(interval) + " minutes ago";
        return Math.floor(seconds) + " seconds ago";
    }

    // --- SKELETON INJECTOR ---
    function renderSkeletons() {
        const container = document.getElementById('all-reviews-container');
        let html = '';
        for(let i=0; i<4; i++) {
            html += `
            <div class="review-card" style="width: 100%; border:none; box-shadow:none;">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <div class="sk-shimmer" style="width:40px; height:40px; border-radius:50%;"></div>
                    <div style="flex:1;">
                        <div class="sk-shimmer" style="width:50%; height:12px; margin-bottom:8px; border-radius:4px;"></div>
                        <div class="sk-shimmer" style="width:30%; height:10px; border-radius:4px;"></div>
                    </div>
                </div>
                <div class="sk-shimmer" style="width:100%; height:12px; margin-bottom:8px; border-radius:4px;"></div>
                <div class="sk-shimmer" style="width:80%; height:12px; border-radius:4px;"></div>
            </div>`;
        }
        container.innerHTML = html;
    }

    // --- CACHING SYSTEM ---
    const CACHE_TTL = 2 * 60 * 1000; 

    function getCachedData(key) {
        const cached = localStorage.getItem(key);
        if (!cached) return null;
        const parsed = JSON.parse(cached);
        if (Date.now() - parsed.timestamp > CACHE_TTL) {
            localStorage.removeItem(key); 
            return null;
        }
        return parsed.data; 
    }

    function setCachedData(key, data) {
        localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), data: data }));
    }

    function invalidateReviewCaches() {
        localStorage.removeItem('cache_all_reviews'); 
        localStorage.removeItem('cache_reviews'); 
    }

    onAuthStateChanged(auth, (user) => {
        if (user) currentUser = user;
        loadReviews();
    });

    document.addEventListener("DOMContentLoaded", () => {
        renderSkeletons(); // Show immediately while Firebase checks auth/cache
    });

    // --- MODAL FUNCTIONS ---
    window.openReviewModal = function() {
        if(!currentUser) {
            alert("Please sign in to write a review!");
            return;
        }
        
        if (!editingReviewId) {
            const myReviews = allReviews.filter(r => r.uid === currentUser.uid);
            if(myReviews.length >= 2) {
                alert("You have reached the limit of 2 reviews per account.");
                return;
            }
        }
        
        document.getElementById('reviewModal').style.display = 'flex';
        document.body.style.overflow = 'hidden'; // Stop background scrolling
    }

    window.openEditModal = function(id, text, rating) {
        editingReviewId = id;
        document.getElementById('modalTitle').innerText = "Edit your review";
        document.getElementById('reviewText').value = text;
        selectedRating = rating;
        updateStars();
        document.getElementById('reviewModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    window.closeReviewModal = function() {
        document.getElementById('reviewModal').style.display = 'none';
        document.body.style.overflow = 'auto';
        
        selectedRating = 0;
        editingReviewId = null;
        updateStars();
        document.getElementById('reviewText').value = "";
        document.getElementById('reviewError').style.display = 'none';
        document.getElementById('modalTitle').innerText = "Rate your experience"; 
    }

    document.querySelectorAll('#starInput i').forEach(star => {
        star.addEventListener('click', function() {
            selectedRating = parseInt(this.getAttribute('data-val'));
            updateStars();
        });
    });

    function updateStars() {
        document.querySelectorAll('#starInput i').forEach(star => {
            const val = parseInt(star.getAttribute('data-val'));
            if(val <= selectedRating) star.classList.add('active');
            else star.classList.remove('active');
        });
    }

    // --- SUBMIT LOGIC ---
    window.submitReview = async function() {
        const text = document.getElementById('reviewText').value.trim();
        const errorMsg = document.getElementById('reviewError');
        
        if(selectedRating === 0) {
            errorMsg.innerText = "Please select a star rating.";
            errorMsg.style.display = 'block';
            return;
        }
        if(text.length < 5) {
            errorMsg.innerText = "Review text is too short. Please add more detail.";
            errorMsg.style.display = 'block';
            return;
        }

        const submitBtn = document.querySelector('.submit-btn');
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;

        try {
            if (editingReviewId) {
                await updateDoc(doc(db, "reviews", editingReviewId), {
                    rating: selectedRating,
                    review: text,
                    status: "pending", 
                    updatedAt: serverTimestamp()
                });
                alert("Review updated! It is now pending approval.");
            } else {
                await addDoc(collection(db, "reviews"), {
                    uid: currentUser.uid,
                    name: currentUser.displayName || "Student",
                    image: currentUser.photoURL || "../img/person.png",
                    rating: selectedRating,
                    review: text,
                    status: "pending", 
                    createdAt: serverTimestamp()
                });
                alert("Review submitted! It will appear as 'Pending' until approved.");
            }

            invalidateReviewCaches();
            closeReviewModal();
            renderSkeletons(); // Show loading again
            loadReviews(); 

        } catch (e) {
            console.error("Error submitting review: ", e);
            errorMsg.innerText = "Connection error. Please try again.";
            errorMsg.style.display = 'block';
        }
        
        submitBtn.innerText = "Submit Review";
        submitBtn.disabled = false;
    }

    // --- DELETE LOGIC ---
    window.deleteMyReview = async function(id) {
        if(!confirm("Are you sure you want to delete this review?")) return;
        
        try {
            await deleteDoc(doc(db, "reviews", id));
            invalidateReviewCaches();
            renderSkeletons();
            loadReviews();
        } catch(e) {
            alert("Error deleting review.");
            console.error(e);
        }
    }

    // --- LOAD REVIEWS ---
    async function loadReviews() {
        try {
            let rawReviewData = getCachedData('cache_all_reviews');

            if (!rawReviewData) {
                const q = query(collection(db, "reviews"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                
                // Keep the timestamp intact for the timeAgo function
                rawReviewData = snapshot.docs.map(doc => {
                    const data = doc.data();
                    return { 
                        id: doc.id, 
                        ...data,
                        _timestamp: data.createdAt ? data.createdAt.seconds : null
                    };
                });
                
                setCachedData('cache_all_reviews', rawReviewData);
            } 

            allReviews = [];
            
            rawReviewData.forEach(data => {
                if (data.status === 'approved') {
                    allReviews.push(data);
                } else if (currentUser && data.uid === currentUser.uid) {
                    allReviews.push(data); 
                }
            });

            renderReviews(allReviews);

        } catch (e) {
            console.error("Error loading reviews:", e);
            document.getElementById('all-reviews-container').innerHTML = "<p style='text-align:center; color:#999; padding:20px;'>Failed to load reviews.</p>";
        }
    }

    window.renderReviews = function(data) {
        const container = document.getElementById('all-reviews-container');
        container.innerHTML = "";

        if(data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#999; padding:40px 20px; background:white; border-radius:15px;'><i class='far fa-comment-dots' style='font-size:30px; margin-bottom:10px; color:#ddd;'></i><br>No reviews yet.<br>Be the first to share your experience!</p>";
            return;
        }

        data.forEach(r => {
            const stars = r.rating;
            const starString = '<i class="fas fa-star" style="color:#FFD700;"></i>'.repeat(stars);
            
            let pendingBadge = "";
            if(r.status === 'pending') {
                pendingBadge = `<span class="pending-tag">PENDING APPROVAL</span>`;
            }

            const displayDate = timeAgo(r.createdAt || {seconds: r._timestamp});

            let actionButtons = "";
            if (currentUser && r.uid === currentUser.uid) {
                const safeReviewForJS = String(r.review).replace(/'/g, "\\'").replace(/"/g, '&quot;');
                actionButtons = `
                    <div class="user-actions">
                        <i class="fas fa-edit action-icon" onclick="openEditModal('${r.id}', '${safeReviewForJS}', ${r.rating})" title="Edit"></i>
                        <i class="fas fa-trash action-icon action-delete" onclick="deleteMyReview('${r.id}')" title="Delete"></i>
                    </div>
                `;
            }

            // XSS Protection for display
            const safeNameHTML = escapeHTML(r.name);
            const safeReviewHTML = escapeHTML(r.review);

            container.innerHTML += `
            <div class="review-card" style="width: 100%; border-radius: 15px;"> 
                <div class="review-header" style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div style="display:flex; gap:12px;">
                        <img src="${r.image}" class="review-img" alt="User" onerror="this.src='../img/person.png'" style="width:45px; height:45px; border-radius:50%; object-fit:cover;">
                        <div>
                            <div class="review-name" style="font-weight:bold; font-size:14px;">${safeNameHTML} ${pendingBadge}</div>
                            <div class="stars" style="font-size:10px; margin:2px 0;">${starString}</div>
                            <div class="review-date">${displayDate}</div>
                        </div>
                    </div>
                    ${actionButtons}
                </div>
                <div class="review-text" style="margin-top:12px; line-height:1.5; font-size:14px; color:#555;">"${safeReviewHTML}"</div>
            </div>`;
        });
    }

    window.filterReviews = function(rating, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if(rating === 'all') {
            renderReviews(allReviews);
        } else {
            const filtered = allReviews.filter(r => r.rating == rating);
            renderReviews(filtered);
        }
    }
</script>
</body>
</html>
