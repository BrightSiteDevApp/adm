<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Contact Us - AFIT Digital Market</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../asset/style.css">
  <link rel="shortcut icon" href="../img/logo-blue.png" type="image/svg+xml">
</head>
<body>

  <div class="app-container">
    
    <div class="header">
      <a href="../" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <span style="font-weight:bold;">Contact Us</span>
    </div>

    <div class="content-page-wrapper">
        <h2 class="content-title">Get in Touch</h2>
        <p>Have questions, feedback, or want to report an issue? Send us a message below.</p>

        <form action="" method="POST" class="contact-form" style="margin-top: 20px;">
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="How can we help you?" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
        <div style="margin-top: 30px; text-align: center; border-top: 1px solid #eee; padding-top: 20px;">
            <p style="margin-bottom: 10px; font-weight: bold; color: #555;">Or chat with us directly</p>
            
            <a href="https://wa.me/2349153375488" class="whatsapp-contact-btn">
                <i class="fab fa-whatsapp" style="font-size: 18px;"></i> Chat on WhatsApp
            </a>
        </div>
    </div>

    <footer class="site-footer">
       <div class="footer-links">
            <a href="../about-us/">About Us</a> | 
            <a href="../safety/">Safety Tips</a> | 
            <a href="../t&c">T & C</a> | 
            <a href="../contact-us/">Contact</a>
        </div>
        <p style="margin-top:10px; color:#777;">&copy; 2026 BrightSiteDev</p>
    </footer>

  </div>

  <script src="../asset/script.js"></script>
</body>
</html>
