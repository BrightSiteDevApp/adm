<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-70VSGR5WBW"></script>
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Login & Sign Up | AFIT Digital Market</title>
    <meta name="description" content="Log in to your AFIT Digital Market account to buy, sell, and chat with vendors on campus. New to ADM? Sign up and join the student marketplace today.">
    
    <link rel="canonical" href="https://afitdgm.store/login/">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="icon" href="../asset/img/app-logo.png" type="image/png">
    <meta name="theme-color" content="#2d8eff">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        * { box-sizing: border-box; }

        :root {
            --brand-color: #2d8eff;
            --brand-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #e0e0e0; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            color: var(--text-main);
        }

        .app-container {
            background: var(--brand-bg);
            width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; justify-content: center;
            padding: 20px; position: relative;
        }

        .auth-card {
            background: white; width: 100%; padding: 40px 30px;
            border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9; transition: all 0.3s ease;
        }

        .back-link { display: inline-block; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-bottom: 20px; font-weight: 600; cursor: pointer;}
        .auth-title { text-align: center; font-size: 24px; font-weight: 800; margin: 0 0 5px; }
        .auth-subtitle { text-align: center; font-size: 14px; color: var(--text-muted); margin: 0 0 25px; line-height: 1.5; }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0;
            border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif;
            outline: none; transition: 0.2s; background: #fff; color: #0f172a;
        }
        .form-input:focus { border-color: var(--brand-color); }

        .flex-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;}
        
        .auth-btn {
            width: 100%; background: var(--brand-color); color: white; border: none;
            padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 800;
            cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        .auth-btn:active { transform: scale(0.98); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .auth-switch { text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted); }
        .auth-switch span, .forgot-password { color: var(--brand-color); font-weight: 600; cursor: pointer; text-decoration: none; }
        .auth-switch span:hover, .forgot-password:hover { text-decoration: underline; }
        
        .forgot-password { font-size: 12px; }

        .message-box { padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 20px; display: none; }
        .error-msg { color: #ef4444; background: #fef2f2; border: 1px solid #fca5a5; }
        .success-msg { color: #059669; background: #d1fae5; border: 1px solid #6ee7b7; }

        .terms-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; text-align: left; }
        .terms-checkbox { margin-top: 2px; cursor: pointer; accent-color: var(--brand-color); width: 16px; height: 16px; flex-shrink: 0; }
        .terms-label { font-size: 12px; color: var(--text-muted); line-height: 1.4; cursor: pointer; }
        .terms-label a { color: var(--brand-color); font-weight: 600; text-decoration: none; }

        /* VIEW TOGGLING CLASSES */
        .view-section { display: none; animation: fadeIn 0.3s ease forwards; }
        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🌙 DARK MODE FIXES */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; }
        body.dark-mode .auth-card { background: #1e293b !important; box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important; border-color: #334155 !important; }
        body.dark-mode .auth-title { color: #f1f5f9 !important; }
        body.dark-mode .auth-subtitle { color: #94a3b8 !important; }
        body.dark-mode .back-link { color: #cbd5e1 !important; }
        body.dark-mode .form-label { color: #cbd5e1 !important; }
        body.dark-mode .form-input { background: #0f172a !important; color: #f1f5f9 !important; border-color: #334155 !important; }
        body.dark-mode .form-input:focus { border-color: var(--brand-color) !important; }
        body.dark-mode .auth-switch, body.dark-mode .terms-label { color: #94a3b8 !important; }
        body.dark-mode .error-msg { background: rgba(239, 68, 68, 0.1) !important; border-color: #ef4444 !important; color: #fca5a5 !important; }
        body.dark-mode .success-msg { background: rgba(16, 185, 129, 0.1) !important; border-color: #10b981 !important; color: #6ee7b7 !important; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        <div class="auth-card">
            <a onclick="handleBackAction()" class="back-link" id="back-btn">← Back to Market</a>
            
            <h1 class="auth-title" id="page-title">Welcome Back</h1>
            <p class="auth-subtitle" id="page-subtitle">Sign in to your AFIT Digital Market account</p>

            <div class="message-box" id="msg-box"></div>

            <!-- ==========================================
                 VIEW 1: LOGIN 
                 ========================================== -->
            <form id="view-login" class="view-section active" onsubmit="processLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" id="login-email" class="form-input" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <div class="flex-between">
                        <label class="form-label" style="margin-bottom: 0;">Password *</label>
                        <span class="forgot-password" onclick="setViewState('recovery')">Forgot Password?</span>
                    </div>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-btn" id="btn-login">Sign In</button>

                <div class="auth-switch">
                    Don't have an account? <span onclick="setViewState('signup')">Create one</span>
                </div>
            </form>

            <!-- ==========================================
                 VIEW 2: SIGNUP 
                 ========================================== -->
            <form id="view-signup" class="view-section" onsubmit="processSignup(event)">
                <div class="form-group">
                    <label class="form-label">Full Name *</label>
                    <input type="text" id="signup-name" class="form-input" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number *</label>
                    <input type="tel" id="signup-phone" class="form-input" placeholder="e.g. 08012345678" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" id="signup-email" class="form-input" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" id="signup-password" class="form-input" placeholder="••••••••" minlength="6" required>
                </div>

                <div class="terms-group">
                    <input type="checkbox" id="terms" class="terms-checkbox" required>
                    <label for="terms" class="terms-label">
                        I agree to the <a href="../terms/index.html" target="_blank">Terms and Conditions</a> and Privacy Policy. *
                    </label>
                </div>

                <button type="submit" class="auth-btn" id="btn-signup">Sign Up</button>

                <div class="auth-switch">
                    Already have an account? <span onclick="setViewState('login')">Sign In</span>
                </div>
            </form>

            <!-- ==========================================
                 VIEW 3: RECOVERY (ENTER EMAIL)
                 ========================================== -->
            <form id="view-recovery" class="view-section" onsubmit="requestOTP(event)">
                <div class="form-group">
                    <label class="form-label">Account Email Address *</label>
                    <input type="email" id="recovery-email" class="form-input" placeholder="Enter your registered email" required>
                </div>

                <button type="submit" class="auth-btn" id="btn-recovery">Send 8-Digit Code</button>
            </form>

            <!-- ==========================================
                 VIEW 4: ENTER OTP & NEW PASSWORD
                 ========================================== -->
            <form id="view-otp" class="view-section" onsubmit="verifyOTPAndReset(event)">
                <div class="form-group">
                    <label class="form-label">8-Digit Reset Code *</label>
                    <input type="text" id="reset-otp" class="form-input" placeholder="e.g. 12345678" required autocomplete="off" maxlength="8">
                </div>

                <div class="form-group">
                    <label class="form-label">Create New Password *</label>
                    <input type="password" id="new-password" class="form-input" placeholder="Enter new password" required minlength="6">
                </div>

                <button type="submit" class="auth-btn" id="btn-otp">Update Password</button>
            </form>

        </div>
    </div>

    <script src="../asset/script.js"></script>

    <script>
        // 🚀 STATE MANAGEMENT
        let currentState = 'login'; // login, signup, recovery, otp
        let savedRecoveryEmail = '';

        function displayMessage(text, isError) {
            const msgBox = document.getElementById('msg-box');
            msgBox.innerText = text;
            msgBox.className = isError ? 'message-box error-msg' : 'message-box success-msg';
            msgBox.style.display = 'block';
        }

        function getSmartRedirectUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('redirect')) return urlParams.get('redirect');
            
            const referrer = document.referrer;
            const currentWebsite = window.location.origin;
            if (referrer && referrer.startsWith(currentWebsite) && !referrer.includes('/login/') && !referrer.includes('/reset-password/')) {
                return referrer; 
            }
            return "../";
        }

        // 🚀 DYNAMIC VIEW SWITCHER
        window.setViewState = function(newState) {
            currentState = newState;
            document.getElementById('msg-box').style.display = 'none';

            // Hide all views
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));

            if (currentState === 'login') {
                document.getElementById('view-login').classList.add('active');
                document.getElementById('page-title').innerText = "Welcome Back";
                document.getElementById('page-subtitle').innerText = "Sign in to your student account";
                document.getElementById('back-btn').innerText = "← Back to Market";

            } else if (currentState === 'signup') {
                document.getElementById('view-signup').classList.add('active');
                document.getElementById('page-title').innerText = "Create Account";
                document.getElementById('page-subtitle').innerText = "Join the ADM student marketplace";
                document.getElementById('back-btn').innerText = "← Back to Market";

            } else if (currentState === 'recovery') {
                document.getElementById('view-recovery').classList.add('active');
                document.getElementById('page-title').innerText = "Reset Password";
                document.getElementById('page-subtitle').innerText = "Enter your email to receive an 8-digit secure code";
                document.getElementById('back-btn').innerText = "← Back to Login";

            } else if (currentState === 'otp') {
                document.getElementById('view-otp').classList.add('active');
                document.getElementById('page-title').innerText = "Enter Code";
                document.getElementById('page-subtitle').innerText = `We sent an 8-digit code to ${savedRecoveryEmail}`;
                document.getElementById('back-btn').innerText = "← Change Email";
            }
        };

        // 🚀 SMART BACK BUTTON
        window.handleBackAction = function() {
            if (currentState === 'otp') {
                setViewState('recovery');
            } else if (currentState === 'recovery') {
                setViewState('login');
            } else {
                window.location.href = '../'; 
            }
        };

        // 🚀 LOGIN LOGIC
        window.processLogin = async function(event) {
            event.preventDefault(); 
            const emailVal = document.getElementById('login-email').value.trim();
            const passwordVal = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login');

            document.getElementById('msg-box').style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Authenticating...";

            try {
                const { error } = await supabaseClient.auth.signInWithPassword({
                    email: emailVal,
                    password: passwordVal
                });

                if (error) throw error;
                window.location.href = getSmartRedirectUrl();
            } catch (error) {
                console.error("Auth Error:", error);
                displayMessage(error.message, true);
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        };

        // 🚀 SIGNUP LOGIC
        window.processSignup = async function(event) {
            event.preventDefault(); 
            const emailVal = document.getElementById('signup-email').value.trim();
            const passwordVal = document.getElementById('signup-password').value;
            const nameVal = document.getElementById('signup-name').value.trim();
            const phoneVal = document.getElementById('signup-phone').value.trim();
            const btn = document.getElementById('btn-signup');

            document.getElementById('msg-box').style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Creating Account...";

            try {
                const { error } = await supabaseClient.auth.signUp({
                    email: emailVal,
                    password: passwordVal,
                    options: { data: { full_name: nameVal, phone: phoneVal } }
                });

                if (error) throw error;
                
                displayMessage("Success! Redirecting...", false);
                setTimeout(() => { window.location.href = getSmartRedirectUrl(); }, 1000);
            } catch (error) {
                console.error("Signup Error:", error);
                displayMessage(error.message, true);
                btn.disabled = false;
                btn.innerText = "Sign Up";
            }
        };

        // 🚀 REQUEST OTP (FORGOT PASSWORD)
        window.requestOTP = async function(event) {
            event.preventDefault();
            const emailVal = document.getElementById('recovery-email').value.trim();
            const btn = document.getElementById('btn-recovery');

            document.getElementById('msg-box').style.display = 'none';
            btn.innerText = "Sending Code...";
            btn.disabled = true;

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(emailVal);
                if (error) throw error;
                
                savedRecoveryEmail = emailVal; 
                setViewState('otp');
                displayMessage("Code sent! Check your inbox or spam folder.", false);

            } catch (error) {
                displayMessage(error.message, true);
            } finally {
                btn.innerText = "Send 8-Digit Code";
                btn.disabled = false;
            }
        };

        // 🚀 VERIFY OTP & UPDATE PASSWORD
        window.verifyOTPAndReset = async function(event) {
            event.preventDefault();
            const otpVal = document.getElementById('reset-otp').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('btn-otp');

            document.getElementById('msg-box').style.display = 'none';
            btn.innerText = "Verifying...";
            btn.disabled = true;

            try {
                const { error: verifyError } = await supabaseClient.auth.verifyOtp({
                    email: savedRecoveryEmail,
                    token: otpVal,
                    type: 'recovery'
                });

                if (verifyError) throw verifyError;

                const { error: updateError } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (updateError) throw updateError;

                displayMessage("Password updated successfully! Logging you in...", false);
                setTimeout(() => { window.location.href = getSmartRedirectUrl(); }, 1500);

            } catch (error) {
                displayMessage("Invalid or expired code. Please try again.", true);
                btn.innerText = "Update Password";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
