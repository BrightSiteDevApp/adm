    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        "@type": "Organization",

    <link rel="icon" href="../asset/img/app-logo.png" type="image/png" sizes="192x192">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <meta name="theme-color" content="#2d8eff">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        * { box-sizing: border-box; }

        :root {
            --brand-color: #2d8eff; /* AFIT DGM Blue */
            --brand-bg: #ffffff; /* Clean white background */
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #e0e0e0; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            color: var(--text-main);
        }

        .app-container {
            background: var(--brand-bg);
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; justify-content: center;
            padding: 20px; position: relative;
        }

        .auth-card {
            background: white; width: 100%; padding: 40px 30px;
            border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }

        .back-link { display: inline-block; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-bottom: 20px; font-weight: 600; cursor: pointer;}
        .auth-title { text-align: center; font-size: 24px; font-weight: 800; margin: 0 0 5px; }
        .auth-subtitle { text-align: center; font-size: 14px; color: var(--text-muted); margin: 0 0 25px; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0;
            border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif;
            outline: none; transition: 0.2s; background: #fff;
        }
        .form-input:focus { border-color: var(--brand-color); }

        .auth-btn {
            width: 100%; background: var(--brand-color); color: white; border: none;
            padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 800;
            cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        .auth-btn:active { transform: scale(0.98); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .auth-switch { text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted); }
        .auth-switch span { color: var(--brand-color); font-weight: 600; cursor: pointer; text-decoration: underline; }

        .forgot-password { display: block; text-align: right; font-size: 12px; color: var(--brand-color); font-weight: 600; cursor: pointer; margin-top: -10px; margin-bottom: 15px; }

        .message-box { padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 20px; display: none; }
        .error-msg { color: #ef4444; background: #fef2f2; border: 1px solid #fca5a5; }
        .success-msg { color: #059669; background: #d1fae5; border: 1px solid #6ee7b7; }

        .signup-only { display: none; }

        .terms-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; }
        .terms-checkbox { margin-top: 2px; cursor: pointer; accent-color: var(--brand-color); width: 16px; height: 16px; flex-shrink: 0; }
        .terms-label { font-size: 12px; color: var(--text-muted); line-height: 1.4; cursor: pointer; }
        .terms-label a { color: var(--brand-color); font-weight: 600; text-decoration: none; transition: 0.2s; }
        .terms-label a:hover { text-decoration: underline; }

        /* VIEW TOGGLING CLASSES */
        .view-section { display: none; animation: fadeIn 0.4s ease forwards; }
        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES                        */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; }
        
        body.dark-mode .auth-card { 
            background: #1e293b !important; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important; 
            border-color: #334155 !important;
        }
        
        body.dark-mode .auth-title { color: #f1f5f9 !important; }
        body.dark-mode .auth-subtitle { color: #94a3b8 !important; }
        body.dark-mode .back-link { color: #cbd5e1 !important; }
        
        body.dark-mode .form-label { color: #cbd5e1 !important; }
        body.dark-mode .form-input { 
            background: #0f172a !important; 
            color: #f1f5f9 !important; 
            border-color: #334155 !important; 
        }
        body.dark-mode .form-input:focus { border-color: var(--brand-color) !important; }
        
        body.dark-mode .auth-switch { color: #94a3b8 !important; }
        body.dark-mode .terms-label { color: #94a3b8 !important; }
        
        body.dark-mode .error-msg { background: rgba(239, 68, 68, 0.1) !important; border-color: #ef4444 !important; color: #fca5a5 !important; }
        body.dark-mode .success-msg { background: rgba(16, 185, 129, 0.1) !important; border-color: #10b981 !important; color: #6ee7b7 !important; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        <div class="auth-card">
            <a onclick="handleBackAction()" class="back-link" id="back-btn">← Back to Market</a>
            
            <h1 class="auth-title" id="page-title">Welcome Back</h1>
            <p class="auth-subtitle" id="page-subtitle">Sign in to your student account</p>

            <div class="message-box" id="msg-box"></div>

            <!-- ==========================================
                 VIEW 1: LOGIN & SIGNUP
                 ========================================== -->
            <form id="view-auth" class="view-section active" onsubmit="processAuth(event)">
                
                <div class="form-group signup-only">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="e.g. John Doe">
                </div>

                <div class="form-group signup-only">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-input" placeholder="e.g. 08012345678">
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" id="email" class="form-input" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group" id="password-group">
                    <label class="form-label">Password *</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <span class="forgot-password" id="forgot-btn" onclick="setViewState('recovery')">Forgot Password?</span>

                <div class="terms-group signup-only">
                    <input type="checkbox" id="terms" class="terms-checkbox">
                    <label for="terms" class="terms-label">
                        I agree to the <a href="../terms/index.html" target="_blank">Terms and Conditions</a> and Privacy Policy. *
                    </label>
                </div>

                <button type="submit" class="auth-btn" id="submit-btn">Sign In</button>

                <div class="auth-switch" id="switch-text">
                    Don't have an account? <span onclick="setViewState('signup')">Create one</span>
                </div>
            </form>

            <!-- ==========================================
                 VIEW 2: RECOVERY (REQUEST EMAIL)
                 ========================================== -->
            <form id="view-recovery" class="view-section" onsubmit="requestOTP(event)">
                <div class="form-group">
                    <label class="form-label">Account Email Address *</label>
                    <input type="email" id="recovery-email" class="form-input" placeholder="Enter your registered email" required>
                </div>

                <button type="submit" class="auth-btn" id="recovery-submit-btn">Send 8-Digit Code</button>
            </form>

            <!-- ==========================================
                 VIEW 3: OTP (ENTER CODE & NEW PASSWORD)
                 ========================================== -->
            <form id="view-otp" class="view-section" onsubmit="verifyOTPAndReset(event)">
                <div class="form-group">
                    <label class="form-label">8-Digit Reset Code *</label>
                    <input type="text" id="reset-otp" class="form-input" placeholder="e.g. 12345678" required autocomplete="off" maxlength="8">
                </div>

                <div class="form-group">
                    <label class="form-label">Create New Password *</label>
                    <input type="password" id="new-password" class="form-input" placeholder="Enter new password" required minlength="6">
                </div>

                <button type="submit" class="auth-btn" id="otp-submit-btn">Update Password & Login</button>
            </form>

        </div>
    </div>

    <script src="../asset/script.js"></script>

    <script>
        // 🚀 STATE MANAGEMENT
        let currentState = 'login'; // Can be 'login', 'signup', 'recovery', 'otp'
        let savedRecoveryEmail = '';

        function displayMessage(text, isError) {
            const msgBox = document.getElementById('msg-box');
            msgBox.innerText = text;
            msgBox.className = isError ? 'message-box error-msg' : 'message-box success-msg';
            msgBox.style.display = 'block';
        }

        function getSmartRedirectUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('redirect')) return urlParams.get('redirect');
            
            const referrer = document.referrer;
            const currentWebsite = window.location.origin;
            if (referrer && referrer.startsWith(currentWebsite) && !referrer.includes('/login/') && !referrer.includes('/reset-password/')) {
                return referrer; 
            }
            return "../";
        }

        // 🚀 DYNAMIC VIEW SWITCHER
        window.setViewState = function(newState) {
            currentState = newState;
            document.getElementById('msg-box').style.display = 'none';

            // Hide all views first
            document.getElementById('view-auth').classList.remove('active');
            document.getElementById('view-recovery').classList.remove('active');
            document.getElementById('view-otp').classList.remove('active');

            const signupFields = document.querySelectorAll('.signup-only');

            if (currentState === 'login') {
                document.getElementById('view-auth').classList.add('active');
                document.getElementById('page-title').innerText = "Welcome Back";
                document.getElementById('page-subtitle').innerText = "Sign in to your student account";
                document.getElementById('back-btn').innerText = "← Back to Market";
                
                document.getElementById('submit-btn').innerText = "Sign In";
                document.getElementById('forgot-btn').style.display = "block";
                document.getElementById('switch-text').innerHTML = `Don't have an account? <span onclick="setViewState('signup')">Create one</span>`;
                
                signupFields.forEach(f => f.style.display = "none");
                document.getElementById('name').required = false;
                document.getElementById('phone').required = false;
                document.getElementById('terms').required = false;

            } else if (currentState === 'signup') {
                document.getElementById('view-auth').classList.add('active');
                document.getElementById('page-title').innerText = "Create Account";
                document.getElementById('page-subtitle').innerText = "Join AFIT Digital Market";
                document.getElementById('back-btn').innerText = "← Back to Market";

                document.getElementById('submit-btn').innerText = "Sign Up";
                document.getElementById('forgot-btn').style.display = "none";
                document.getElementById('switch-text').innerHTML = `Already have an account? <span onclick="setViewState('login')">Sign In</span>`;
                
                signupFields.forEach(f => {
                    if (f.classList.contains('terms-group')) f.style.display = "flex";
                    else f.style.display = "block";
                });
                
                document.getElementById('name').required = true;
                document.getElementById('phone').required = true;
                document.getElementById('terms').required = true;

            } else if (currentState === 'recovery') {
                document.getElementById('view-recovery').classList.add('active');
                document.getElementById('page-title').innerText = "Reset Password";
                document.getElementById('page-subtitle').innerText = "Enter your email to receive an 8-digit code";
                document.getElementById('back-btn').innerText = "← Back to Login";

            } else if (currentState === 'otp') {
                document.getElementById('view-otp').classList.add('active');
                document.getElementById('page-title').innerText = "Enter Code";
                document.getElementById('page-subtitle').innerText = `A code was sent to ${savedRecoveryEmail}`;
                document.getElementById('back-btn').innerText = "← Back to Email Entry";
            }
        };

        // 🚀 SMART BACK BUTTON LOGIC
        window.handleBackAction = function() {
            if (currentState === 'otp') {
                setViewState('recovery');
            } else if (currentState === 'recovery') {
                setViewState('login');
            } else {
                window.location.href = '../'; // Go back to market
            }
        };

        // 🚀 AUTH LOGIC (LOGIN / SIGNUP)
        window.processAuth = async function(event) {
            event.preventDefault(); 
            
            const emailVal = document.getElementById('email').value.trim();
            const passwordVal = document.getElementById('password').value;
            const nameVal = document.getElementById('name').value.trim();
            const phoneVal = document.getElementById('phone').value.trim();
            const termsChecked = document.getElementById('terms').checked;
            const btn = document.getElementById('submit-btn');

            document.getElementById('msg-box').style.display = 'none';

            if (currentState === 'signup' && !termsChecked) {
                displayMessage("You must agree to the Terms and Conditions to register.", true);
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                if (currentState === 'signup') {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: emailVal,
                        password: passwordVal,
                        options: { data: { full_name: nameVal, phone: phoneVal } }
                    });

                    if (error) throw error;
                    
                    displayMessage("Success! Redirecting...", false);
                    setTimeout(() => { window.location.href = getSmartRedirectUrl(); }, 1000);

                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: emailVal,
                        password: passwordVal
                    });

                    if (error) throw error;
                    window.location.href = getSmartRedirectUrl();
                }
            } catch (error) {
                console.error("Auth Error:", error);
                displayMessage(error.message, true);
            } finally {
                btn.disabled = false;
                btn.innerText = currentState === 'signup' ? "Sign Up" : "Sign In";
            }
        };

        // 🚀 RECOVERY LOGIC (SEND CODE)
        window.requestOTP = async function(event) {
            event.preventDefault();
            
            const emailVal = document.getElementById('recovery-email').value.trim();
            const btn = document.getElementById('recovery-submit-btn');

            document.getElementById('msg-box').style.display = 'none';
            btn.innerText = "Sending Code...";
            btn.disabled = true;

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(emailVal);
                if (error) throw error;
                
                savedRecoveryEmail = emailVal; // Save to show on next screen
                setViewState('otp');
                displayMessage("Success! Check your email inbox or spam folder for the code.", false);

            } catch (error) {
                displayMessage(error.message, true);
            } finally {
                btn.innerText = "Send 8-Digit Code";
                btn.disabled = false;
            }
        };

        // 🚀 OTP VERIFICATION & PASSWORD UPDATE
        window.verifyOTPAndReset = async function(event) {
            event.preventDefault();

            const otpVal = document.getElementById('reset-otp').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('otp-submit-btn');

            document.getElementById('msg-box').style.display = 'none';
            btn.innerText = "Verifying...";
            btn.disabled = true;

            try {
                // 1. Verify 8-Digit Code
                const { error: verifyError } = await supabaseClient.auth.verifyOtp({
                    email: savedRecoveryEmail,
                    token: otpVal,
                    type: 'recovery'
                });

                if (verifyError) throw verifyError;

                // 2. Automatically logged in, now update password
                const { error: updateError } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (updateError) throw updateError;

                displayMessage("Password updated successfully! Logging you in...", false);
                setTimeout(() => { window.location.href = getSmartRedirectUrl(); }, 1500);

            } catch (error) {
                displayMessage("Invalid or expired code. Please try again.", true);
                btn.innerText = "Update Password & Login";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
