<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Requests - AFIT Market</title>
    <link rel="stylesheet" href="asset/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png">
</head>
<body data-page="requests">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <span style="font-weight:bold;">Student Requests</span>
            <div class="notification-icon-box" id="theme-toggle" style="margin-left:auto;">
                <i class="fas fa-moon"></i>
            </div>
        </div>

        <div style="padding: 20px; text-align: center; background: #f9f9f9; border-bottom: 1px solid #eee;">
            <h3>Looking for something?</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Post your request here and let vendors find you!</p>
            
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSejry_A33x76Y8BxHYnJcv4_sbz0irToz30TNs4s6N55YdT8w/viewform?usp=dialog" target="_blank" class="chat-btn" style="background: #2d8eff; display: inline-block; width: auto; padding: 10px 30px;">
                <i class="fas fa-plus"></i> Post a Request
            </a>
        </div>

        <div id="requests-list" style="padding: 15px;">
            <p style="text-align:center; color:#888; margin-top:20px;">Loading requests...</p>
        </div>
    </div>

    <script src="asset/script.js"></script>

    <script>
        // ✅ YOUR SHEET ID
        const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4";
        const apiRoot = `https://opensheet.elk.sh/${sheetID}`;

        document.addEventListener("DOMContentLoaded", () => {
            fetch(`${apiRoot}/Requests`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('requests-list');
                container.innerHTML = "";

                if(data.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:#888; margin-top:20px;'>No requests yet.</p>";
                    return;
                }

                // Reverse to show newest first
                data.reverse().forEach(req => {
                    // Matching your exact Google Form Questions
                    const item = req["What do you need?"] || "Unknown Item";
                    const budget = req["Your Budget"] || "Negotiable";
                    const contact = req["WhatsApp Number"];
                    
                    let waLink = "#";
                    if(contact) {
                        const cleanPhone = String(contact).replace(/[^0-9]/g, '');
                        waLink = `https://wa.me/${cleanPhone}?text=Hi,%20I%20saw%20your%20request%20for%20"${item}"%20on%20AFIT%20Market.%20I%20have%20it.`;
                    }

                    container.innerHTML += `
                    <div class="ad-card" style="width: 100%; display: flex; flex-direction: row; align-items: center; padding: 15px; margin-bottom: 10px; height: auto;">
                        <div style="flex: 1;">
                            <div class="ad-title" style="font-size: 14px; margin-bottom: 5px;">${item}</div>
                            <div class="ad-price" style="font-size: 12px; color: #2d8eff;">Budget: ${budget}</div>
                        </div>
                        <a href="${waLink}" class="chat-btn" style="width: auto; padding: 8px 15px; font-size: 12px; background: #25D366;">
                            <i class="fab fa-whatsapp"></i> I have this
                        </a>
                    </div>`;
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('requests-list').innerHTML = "<p style='text-align:center; margin-top:20px;'>Error loading requests.</p>";
            });
        });
    </script>
</body>
</html>
