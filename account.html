<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - AFIT Digital Market</title>
    <link rel="stylesheet" href="asset/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="img/app-logo.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body { background-color: #f8f9fa; }
        
        /* Premium Profile Card */
        .profile-card {
            background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(45, 142, 255, 0.1);
            border: 1px solid #e6f2ff;
            position: relative;
            overflow: hidden;
        }
        
        /* Decorative background circle */
        .profile-card::before {
            content: ''; position: absolute; top: -50px; right: -50px;
            width: 150px; height: 150px; background: rgba(45, 142, 255, 0.05); border-radius: 50%;
        }

        .profile-img-large {
            width: 90px; height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .user-badge {
            background: #eef7ff; color: #2d8eff; font-size: 10px; font-weight: bold;
            padding: 4px 10px; border-radius: 12px; display: inline-block; margin-top: 8px;
            letter-spacing: 0.5px;
        }
        
        /* Menu Grouping */
        .menu-section-title {
            font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase;
            letter-spacing: 1px; margin: 25px 0 10px 10px;
        }

        .account-option {
            display: flex; align-items: center; background: white; padding: 15px;
            border-radius: 15px; margin-bottom: 12px; text-decoration: none; color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: all 0.2s; border: 1px solid transparent;
        }
        .account-option:active { transform: scale(0.98); background: #f8f9fa; }
        
        .option-icon {
            width: 40px; height: 40px; background: #f5f7fa; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin-right: 15px; color: #555; font-size: 18px; transition: background 0.2s;
        }
        .option-text { flex: 1; font-size: 14px; font-weight: 600; }
        
        /* Dark Mode */
        body.dark-mode .profile-card { background: linear-gradient(135deg, #1e1e1e 0%, #151515 100%); border-color: #333; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        body.dark-mode .account-option { background: #1e1e1e; color: white; border-color: #2a2a2a; }
        body.dark-mode .account-option:active { background: #222; }
        body.dark-mode .option-icon { background: #2a2a2a; color: #ccc; }
        body.dark-mode .user-badge { background: #111; border: 1px solid #333; }
    </style>
</head>
<body data-page="account">

    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>

    <div id="preloader">
        <div class="loader-content">
            <img src="img/logo-blue.png" alt="Loading..." class="loader-logo">
            <div class="loading-bar"></div>
        </div>
    </div>

    <div class="app-container">
        <div class="header">
            <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <span style="font-weight:bold;">My Account</span>
            <div style="width:30px;"></div>
        </div>

        <div id="account-content" style="padding: 15px; display: none;">
            
            <div class="profile-card">
                <img src="img/person.png" id="user-img" class="profile-img-large" onerror="this.src='img/person.png'">
                <h3 id="user-name" style="margin:0; font-size:22px; color: #2d3436;">Student</h3>
                <p id="user-email" style="margin:5px 0 0; color:#777; font-size:13px;">...</p>
                <div class="user-badge"><i class="fas fa-check-circle"></i> Verified User</div>
            </div>

            <div id="vendor-zone" style="display: none;">
                <div class="menu-section-title">Seller Tools</div>
                
                <a href="admin.html" id="btn-admin" class="account-option" style="display: none; border-left: 4px solid #9c27b0;">
                    <div class="option-icon" style="background: #f3e5f5; color: #9c27b0;"><i class="fas fa-user-shield"></i></div>
                    <div class="option-text" style="color: #9c27b0;">Super Admin Panel</div>
                    <i class="fas fa-chevron-right" style="color: #9c27b0;"></i>
                </a>

                <a href="dashboard.html" id="btn-dashboard" class="account-option" style="border-left: 4px solid #2d8eff;">
                    <div class="option-icon" style="background: #eef7ff; color: #2d8eff;"><i class="fas fa-store"></i></div>
                    <div class="option-text" style="color: #2d8eff;">Open Vendor Dashboard</div>
                    <i class="fas fa-chevron-right" style="color: #2d8eff;"></i>
                </a>

                <a href="ticket.html" id="btn-ticket" class="account-option" style="border-left: 4px solid #009688;">
                    <div class="option-icon" style="background: #e0f2f1; color: #009688;"><i class="fas fa-ticket-alt"></i></div>
                    <div class="option-text" style="color: #009688;">Vendor Support Tickets</div>
                    <i class="fas fa-chevron-right" style="color: #009688;"></i>
                </a>

                <a href="payment.html" id="btn-renew" class="account-option" style="border-left: 4px solid #f39c12;">
                    <div class="option-icon" style="background: #fdf5e6; color: #f39c12;"><i class="fas fa-credit-card"></i></div>
                    <div class="option-text" style="color: #f39c12;">Renew Subscription</div>
                    <i class="fas fa-chevron-right" style="color: #f39c12;"></i>
                </a>
            </div>

            <div class="menu-section-title">My Activity</div>
            
            <a href="inbox/" class="account-option">
                <div class="option-icon" style="color: #2d8eff;"><i class="fas fa-comment-dots"></i></div>
                <div class="option-text">Messages</div>
                <i class="fas fa-chevron-right" style="color:#ddd;"></i>
            </a>

            <a href="saved.html" class="account-option">
                <div class="option-icon" style="color: #ff4757;"><i class="fas fa-heart"></i></div>
                <div class="option-text">Saved Items</div>
                <i class="fas fa-chevron-right" style="color:#ddd;"></i>
            </a>

            <a href="requests/" class="account-option">
                <div class="option-icon" style="color: #f39c12;"><i class="fas fa-bullhorn"></i></div>
                <div class="option-text">My Requests</div>
                <i class="fas fa-chevron-right" style="color:#ddd;"></i>
            </a>

            <div class="menu-section-title">Settings & Help</div>

            <a href="https://wa.me/2349153375488?text=Hello%20Admin,%20I%20need%20help%20with..." class="account-option">
                <div class="option-icon" style="color: #2ecc71;"><i class="fas fa-headset"></i></div>
                <div class="option-text">Contact Support</div>
                <i class="fas fa-chevron-right" style="color:#ddd;"></i>
            </a>

            <a href="#" onclick="handleLogout()" class="account-option" style="margin-top: 25px; border: 1px solid #ff4757;">
                <div class="option-icon" style="background: #fff0f1; color: #ff4757;"><i class="fas fa-sign-out-alt"></i></div>
                <div class="option-text" style="color: #ff4757;">Log Out</div>
            </a>
            
        </div>
    </div>

    <footer class="site-footer" style="margin-top: 20px; text-align: center; padding: 20px; color: #777; font-size: 12px;">
        <p style="margin-top:10px; color:#777; font-size: 12px;">
            &copy; 2026 All rights reserved. Powered by 
            <a href="https://brightsitedev.tech" target="_blank" style="color:#2d8eff; text-decoration:none; font-weight:bold;">Brightsitedev</a>
        </p>
    </footer>

    <script src="asset/script.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
            authDomain: "afit-market-auth.firebaseapp.com",
            projectId: "afit-market-auth",
            storageBucket: "afit-market-auth.firebasestorage.app",
            messagingSenderId: "894920886640",
            appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4";
        const apiRoot = `https://opensheet.elk.sh/${sheetID}`;
        
        const ADMIN_EMAIL = "afitdgm@gmail.com";

        function getCachedVendorStatus(email) {
            const cached = localStorage.getItem(`vendor_status_${email}`);
            if (!cached) return null;
            const parsed = JSON.parse(cached);
            const TTL = parsed.isVendor ? (24 * 60 * 60 * 1000) : (20 * 1000); 

            if (Date.now() - parsed.timestamp > TTL) {
                localStorage.removeItem(`vendor_status_${email}`); 
                return null;
            }
            return parsed.isVendor; 
        }
        function setCachedVendorStatus(email, isVendor) {
            localStorage.setItem(`vendor_status_${email}`, JSON.stringify({
                timestamp: Date.now(),
                isVendor: isVendor
            }));
        }

        onAuthStateChanged(auth, async (user) => {
            const preloader = document.getElementById('preloader');
            
            if (user) {
                document.getElementById('user-name').innerText = user.displayName || "Student";
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-img').src = user.photoURL || "img/person.png";

                const email = user.email.toLowerCase().trim();

                let isAdmin = false;
                if (email === ADMIN_EMAIL) {
                    isAdmin = true;
                    document.getElementById('vendor-zone').style.display = "block";
                    document.getElementById('btn-admin').style.display = "flex";
                } 
                
                await checkIfVendor(email, isAdmin);

                if(preloader) preloader.style.display = 'none';
                document.getElementById('account-content').style.display = 'block';
                
                if(document.body.classList.contains('dark-mode')) {
                    document.getElementById('user-name').style.color = "white";
                }
            } else {
                if(preloader) preloader.style.display = 'none';
                // 🚀 FIXED: Redirects to login.html instead of index.html
                window.location.href = "login.html";
            }
        });

        async function checkIfVendor(email, isAdmin) {
            const cachedStatus = getCachedVendorStatus(email);
            
            if (cachedStatus === true) {
                showVendorTools();
                return;
            } else if (cachedStatus === false && !isAdmin) {
                return; 
            }

            try {
                const [v1, v2] = await Promise.all([
                    fetch(`${apiRoot}/Vendors`).then(res => res.json()),
                    fetch(`${apiRoot}/Vendors_v2`).then(res => res.json().catch(() => []))
                ]);

                const allVendors = [...v1, ...v2];
                const isVendor = allVendors.some(v => v.Email && v.Email.toLowerCase().trim() === email);

                setCachedVendorStatus(email, isVendor);

                if (isVendor) showVendorTools();
                
            } catch (err) { 
                console.error("Failed to verify vendor status:", err); 
            }
        }

        function showVendorTools() {
            document.getElementById('vendor-zone').style.display = "block";
        }

        window.handleLogout = () => {
            if(confirm("Log out now?")) {
                localStorage.removeItem(`vendor_status_${document.getElementById('user-email').innerText}`); 
                signOut(auth).then(() => window.location.href = "index.html");
            }
        };
    </script>
</body>
</html>
