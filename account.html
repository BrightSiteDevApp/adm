<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - AFIT Market</title>
    <link rel="stylesheet" href="asset/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png">
</head>
<body data-page="account">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <span style="font-weight:bold;">My Account</span>
             <div class="notification-icon-box" id="theme-toggle" style="margin-left:auto;">
                <i class="fas fa-moon"></i>
            </div>
        </div>

        <div id="loading-state" style="text-align:center; padding:50px;">
            <p>Loading profile...</p>
        </div>

        <div id="logged-out-state" style="display:none; text-align:center; padding:50px;">
            <img src="img/logo-blue.png" style="width:60px; margin-bottom:20px;">
            <h3>You are not logged in</h3>
            <p style="color:#777; margin-bottom:20px;">Sign in to view your profile.</p>
            <a href="login.html" class="chat-btn" style="background:#2d8eff;">Go to Login</a>
        </div>

        <a href="dashboard.html" class="account-option" id="btn-dashboard" style="display: none; background: #e3f2fd; border: 1px solid #2d8eff;">
    <div class="option-icon" style="color: #2d8eff;"><i class="fas fa-store"></i></div>
    <div class="option-text" style="color: #2d8eff; font-weight: bold;">Open Vendor Dashboard</div>
    <i class="fas fa-chevron-right"></i>
</a>

        <div id="profile-view" style="display:none;">
            <div class="profile-header-card">
                <img id="user-img" src="" class="profile-pic-large" alt="User">
                <div class="profile-name" id="user-name">...</div>
                <div class="profile-email" id="user-email">...</div>
                <button onclick="toggleEdit()" style="background:rgba(255,255,255,0.2); color:white; border:none; padding:5px 15px; border-radius:15px; font-size:11px; cursor:pointer;">
                    <i class="fas fa-pen"></i> Edit Profile
                </button>
            </div>

            <div class="action-grid">
                <a href="saved.html" class="action-card">
                    <i class="fas fa-heart" style="color:#ff4757;"></i>
                    <span>Saved Items</span>
                </a>
                <div class="action-card" onclick="alert('Coming soon!')">
                    <i class="fas fa-store"></i>
                    <span>My Orders</span>
                </div>
            </div>

            <div id="edit-form" class="edit-form">
                <h4 style="margin-bottom:15px;">Edit Details</h4>
                <label style="font-size:12px; color:#777;">Display Name</label>
                <input type="text" id="new-name" class="form-input" placeholder="Enter Name">
                
                <label style="font-size:12px; color:#777;">Profile Picture URL (Optional)</label>
                <input type="text" id="new-pic" class="form-input" placeholder="Paste image link here...">
                
                <button id="save-btn" class="chat-btn" style="width:100%; margin-top:5px;">Save Changes</button>
            </div>

            <div style="padding: 20px;">
                <button id="btn-logout" class="chat-btn" style="background:transparent; border:1px solid #ff4757; color:#ff4757;">
                    Logout
                </button>
            </div>
        </div>

    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
        authDomain: "afit-market-auth.firebaseapp.com",
        projectId: "afit-market-auth",
        storageBucket: "afit-market-auth.firebasestorage.app",
        messagingSenderId: "894920886640",
        appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // VENDOR SHEET CONFIG
    const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4";
    const apiRoot = `https://opensheet.elk.sh/${sheetID}`;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // 1. Load User Info
            document.getElementById('user-name').innerText = user.displayName || "Student";
            document.getElementById('user-email').innerText = user.email;
            document.getElementById('user-img').src = user.photoURL || "img/person.png";

            // 2. CHECK IF VENDOR (To show Dashboard Button)
            checkIfVendor(user.email);

        } else {
            window.location.href = "login.html";
        }
    });

    async function checkIfVendor(email) {
        try {
            const res = await fetch(`${apiRoot}/Vendors`);
            const vendors = await res.json();
            
            // Check if email exists in sheet (Case Insensitive)
            const isVendor = vendors.some(v => 
                v.Email && v.Email.toLowerCase().trim() === email.toLowerCase().trim()
            );

            if (isVendor) {
                document.getElementById('btn-dashboard').style.display = "flex";
            }
        } catch (err) {
            console.error("Error checking vendor status:", err);
        }
    }

    window.handleLogout = () => {
        if(confirm("Are you sure you want to log out?")) {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        }
    };
</script>
</body>
</html>
