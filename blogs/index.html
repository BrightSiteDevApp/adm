<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    
    <title>Campus Gist & News | AFIT Digital Market</title>
    
    <meta property="og:title" content="Campus Gist & News | AFIT Digital Market">
    <meta property="og:description" content="Stay updated with the latest Exams, Gossip, and Important Notices from AFIT.">
    <meta property="og:image" content="https://afitdgm.store/img/app-logo.png"> 
    <meta property="og:url" content="https://afitdgm.store/blogs/">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    
    <link rel="icon" href="../img/app-logo.png" type="image/png" sizes="192x192">
    
    <style>
        body { background-color: #f8f9fa; }
        
        /* Header */
        .blog-header-modern {
            padding: 35px 20px 15px;
            background: linear-gradient(to bottom, #ffffff, #f8f9fa);
            text-align: center;
        }
        .page-title { font-size: 28px; font-weight: 800; margin: 0 0 8px 0; color: #2d8eff; }
        .header-subtitle { font-size: 14px; color: #777; margin: 0; line-height: 1.5; }

        /* Search */
        .search-wrapper { position: relative; max-width: 450px; margin: 25px auto 15px; }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 16px; }
        .blog-search-input {
            width: 100%; padding: 16px 16px 16px 45px; border-radius: 30px;
            border: 1px solid #eaeaea; font-size: 14px; background: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04); outline: none; transition: all 0.3s;
        }
        .blog-search-input:focus { border-color: #2d8eff; box-shadow: 0 8px 25px rgba(45, 142, 255, 0.15); }

        /* Category Chips */
        .chip-container {
            display: flex; gap: 10px; overflow-x: auto; padding: 5px 20px 15px;
            scrollbar-width: none; /* Firefox */
        }
        .chip-container::-webkit-scrollbar { display: none; }
        .cat-chip {
            padding: 8px 16px; background: white; border: 1px solid #ddd; border-radius: 20px;
            font-size: 12px; font-weight: 600; color: #555; white-space: nowrap; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .cat-chip.active { background: #2d8eff; color: white; border-color: #2d8eff; }

        /* Modern Blog Card */
        .modern-blog-card {
            background: white; border-radius: 16px; overflow: hidden; margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; transition: transform 0.2s;
        }
        .modern-blog-card:active { transform: scale(0.98); }
        .blog-cover { width: 100%; height: 180px; object-fit: cover; display: block; cursor: pointer; }
        .blog-content-box { padding: 15px; cursor: pointer; }
        
        .blog-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: #888; margin-bottom: 8px; font-weight: 600; text-transform: uppercase;
        }
        .cat-badge { background: #eef7ff; color: #2d8eff; padding: 3px 8px; border-radius: 10px; }
        .modern-title { font-size: 16px; font-weight: 800; color: #2d3436; margin: 0 0 8px 0; line-height: 1.4; }
        .modern-snippet { font-size: 13px; color: #636e72; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .action-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 15px; padding-top: 15px; border-top: 1px solid #f5f5f5;
        }
        .stats-group { display: flex; gap: 15px; }
        .stat-item { display: flex; align-items: center; gap: 5px; color: #888; font-size: 12px; font-weight: bold; }
        .stat-item.active-like { color: #ff4757; }
        .share-icon { font-size: 16px; color: #2d8eff; padding: 8px; cursor: pointer; }

        /* Modal & Comments */
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .blog-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:3000; justify-content:center; align-items:end; }
        .blog-modal-content { 
            background: white; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; 
            max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease-out; position: relative; padding-bottom: 80px;
        }
        .modal-hero-img { width: 100%; height: 200px; object-fit: cover; }
        .modal-body { padding: 20px; }
        .modal-title { font-size: 20px; font-weight: 800; margin: 0 0 5px; color: #2d3436; line-height: 1.3; }
        .modal-text { white-space: pre-wrap; line-height: 1.8; color: #2d3436; font-size: 15px; margin-top: 20px; word-wrap: break-word; }
        .modal-text a { color: #2d8eff; text-decoration: underline; font-weight: 600; }

        /* Comment UI */
        .comments-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .comment-card { display: flex; gap: 10px; margin-bottom: 15px; }
        .comment-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background:#eee; }
        .comment-bubble { background: #f5f6fa; padding: 10px 15px; border-radius: 0 15px 15px 15px; flex: 1; }
        .comment-name { font-size: 12px; font-weight: bold; color: #333; margin-bottom: 3px; }
        .comment-text { font-size: 13px; color: #555; line-height: 1.4; }
        
        .comment-input-area {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px;
            background: white; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); display: flex; gap: 10px; align-items: center;
        }
        .comment-input {
            flex: 1; padding: 12px 15px; border-radius: 20px; border: 1px solid #ddd; background: #f9f9f9; outline: none; font-size: 13px;
        }
        .comment-send-btn {
            background: #2d8eff; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px;
        }

        /* Load More Button */
        #load-more-container { text-align: center; margin: 30px 0; display: none; }
        #load-more-btn {
            background: #333; color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s;
        }
        #load-more-btn:active { transform: scale(0.95); }

        /* Dark Mode Updates */
        body.dark-mode { background: #121212; }
        body.dark-mode .blog-header-modern { background: #1e1e1e; }
        body.dark-mode .blog-search-input { background: #2d3436; border-color: #444; color: white; }
        body.dark-mode .cat-chip { background: #2d3436; border-color: #444; color: #ccc; }
        body.dark-mode .cat-chip.active { background: #2d8eff; color: white; }
        body.dark-mode .modern-blog-card { background: #1e1e1e; border-color: #333; }
        body.dark-mode .modern-title { color: #dfe6e9; }
        body.dark-mode .modern-snippet { color: #b2bec3; }
        body.dark-mode .cat-badge { background: #111; border: 1px solid #333; }
        body.dark-mode .action-row, body.dark-mode .comments-section { border-color: #333; }
        body.dark-mode .blog-modal-content { background: #1e1e1e; color: white; }
        body.dark-mode .modal-title { color: white; }
        body.dark-mode .modal-text { color: #ddd; }
        body.dark-mode .comment-input-area { background: #1e1e1e; border-top: 1px solid #333; }
        body.dark-mode .comment-input { background: #2d3436; border-color: #444; color: white; }
        body.dark-mode .comment-bubble { background: #2d3436; }
        body.dark-mode .comment-name { color: #eee; }
        body.dark-mode .comment-text { color: #ccc; }
        /* --- SKELETON LOADING UI --- */
        @keyframes skeleton-loading {
            0% { background-position: -200px 0; }
            100% { background-position: calc(200px + 100%) 0; }
        }

        .skeleton-blog-card {
            background: white; border-radius: 16px; overflow: hidden;
            margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
        }

        .sk-shimmer {
            background: #eee;
            background-image: linear-gradient(90deg, #eee, #f5f5f5, #eee);
            background-size: 200px 100%;
            animation: skeleton-loading 1.5s infinite linear;
            border-radius: 4px;
        }

        .sk-img-large { width: 100%; height: 180px; border-radius: 0; }
        .sk-content { padding: 15px; }
        .sk-meta { width: 30%; height: 12px; margin-bottom: 15px; }
        .sk-title { width: 80%; height: 20px; margin-bottom: 10px; }
        .sk-text { width: 100%; height: 14px; margin-bottom: 8px; }
        .sk-text-short { width: 60%; height: 14px; margin-bottom: 15px; }
        .sk-action { width: 100%; height: 40px; border-radius: 20px; margin-top: 15px; }
        
        body.dark-mode .skeleton-blog-card { background: #1e1e1e; border-color: #333; box-shadow: none; }
        body.dark-mode .sk-shimmer {
            background-color: #333; background-image: linear-gradient(90deg, #333, #444, #333);
        }
    </style>
</head>
<body>

<script src="../asset/script.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, arrayUnion, arrayRemove, query, orderBy, limit, startAfter, increment, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
        authDomain: "afit-market-auth.firebaseapp.com",
        projectId: "afit-market-auth",
        storageBucket: "afit-market-auth.firebasestorage.app",
        messagingSenderId: "894920886640",
        appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let allFetchedBlogs = []; 
    let lastVisibleDoc = null; 
    let currentActiveCategory = "All"; 
    let activeBlogId = null; 
    let editingCommentTime = null; 
    let hasMoreInDB = false;

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if(allFetchedBlogs.length === 0) {
            loadInitialBlogs(); 
        } else {
            renderBlogs(); 
        }
    });

   async function loadInitialBlogs() {
       const container = document.getElementById('blog-container');
       try {
           const q = query(collection(db, "blogs"), orderBy("timestamp", "desc"), limit(5));
           const snapshot = await getDocs(q);
           container.innerHTML = ""; 
           if(!snapshot.empty) {
               lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
               hasMoreInDB = snapshot.docs.length === 5;
               allFetchedBlogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
               renderBlogs();

               const urlParams = new URLSearchParams(window.location.search);
               const postId = urlParams.get('post');
               if (postId) {
                   const targetBlog = allFetchedBlogs.find(b => b.id === postId);
                   if (targetBlog) { triggerOpenBlog(targetBlog); } 
                   else {
                       const docSnap = await getDoc(doc(db, "blogs", postId));
                       if (docSnap.exists()) {
                           const oldBlog = { id: docSnap.id, ...docSnap.data() };
                           allFetchedBlogs.push(oldBlog); 
                           triggerOpenBlog(oldBlog); 
                       }
                   }
               }
           } else {
               document.getElementById('no-posts-msg').style.display = 'block';
           }
       } catch(e) { 
           console.error(e); 
           container.innerHTML = "<p style='text-align:center;'>Failed to load network.</p>";
       }
   }

    window.loadMore = async function() {
        if (!lastVisibleDoc) return;
        const btn = document.getElementById('load-more-btn');
        btn.innerText = "Loading...";
        try {
            const q = query(collection(db, "blogs"), orderBy("timestamp", "desc"), startAfter(lastVisibleDoc), limit(5));
            const snapshot = await getDocs(q);
            if(!snapshot.empty) {
                lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
                hasMoreInDB = snapshot.docs.length === 5;
                const newBlogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                allFetchedBlogs = [...allFetchedBlogs, ...newBlogs];
                renderBlogs();
            } else {
                hasMoreInDB = false;
                document.getElementById('load-more-container').style.display = 'none';
            }
        } catch(e) { console.error(e); }
        btn.innerText = "Load More";
    }

    window.filterCategory = function(cat) {
        currentActiveCategory = cat;
        document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
        event.target.classList.add('active');
        renderBlogs();
    }

    document.getElementById('blogSearchInput').addEventListener('input', (e) => {
        renderBlogs(e.target.value.toLowerCase().trim());
    });

    function renderBlogs(searchTerm = "") {
        const container = document.getElementById('blog-container');
        const noMsg = document.getElementById('no-posts-msg');
        const loadMoreContainer = document.getElementById('load-more-container');
        container.innerHTML = "";
        let visibleCount = 0;

        allFetchedBlogs.forEach(b => {
            const category = b.category || "News"; 
            const titleText = b.title.toLowerCase();
            const matchesCat = currentActiveCategory === "All" || category === currentActiveCategory;
            const matchesSearch = !searchTerm || titleText.includes(searchTerm);

            if (matchesCat && matchesSearch) {
                visibleCount++;
                const date = b.timestamp ? new Date(b.timestamp.seconds * 1000).toLocaleDateString() : "Recent";
                const isLiked = currentUser && (b.likes || []).includes(currentUser.uid);
                const heartIcon = isLiked ? 'fas fa-heart' : 'far fa-heart';

                const div = document.createElement('div');
                div.className = "modern-blog-card";
                div.innerHTML = `
                    <img src="${b.image}" class="blog-cover" onclick="openBlogById('${b.id}')">
                    <div class="blog-content-box" onclick="openBlogById('${b.id}')">
                        <div class="blog-meta"><span class="cat-badge">${category}</span><span>${date}</span></div>
                        <h3 class="modern-title">${b.title}</h3>
                        <div class="modern-snippet">${b.snippet}</div>
                        <div class="action-row" onclick="event.stopPropagation()">
                            <div class="stats-group">
                                <div class="stat-item ${isLiked ? 'active-like' : ''}" onclick="toggleLike('${b.id}')">
                                    <i class="${heartIcon}"></i> <span id="count-${b.id}">${(b.likes || []).length}</span>
                                </div>
                                <div class="stat-item"><i class="far fa-eye"></i> ${b.views || 0}</div>
                                <div class="stat-item"><i class="far fa-comment-dots"></i> ${(b.comments || []).length}</div>
                            </div>
                            <i class="fas fa-share-alt share-icon" onclick="performShare('${b.id}', '${b.title.replace(/'/g, "\\'")}', '${(b.snippet||"").replace(/'/g, "\\'")}')"></i>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            }
        });
        noMsg.style.display = visibleCount === 0 ? 'block' : 'none';
        loadMoreContainer.style.display = (visibleCount > 0 && hasMoreInDB) ? 'block' : 'none';
    }

    window.openBlogById = function(blogId) {
        const targetBlog = allFetchedBlogs.find(b => b.id === blogId);
        if (targetBlog) triggerOpenBlog(targetBlog);
    }

    function triggerOpenBlog(b) {
        activeBlogId = b.id;
        document.getElementById('modalImg').src = b.image;
        document.getElementById('modalCat').innerText = b.category || "News";
        document.getElementById('modalTitle').innerText = b.title;
        document.getElementById('modalDate').innerText = b.timestamp ? new Date(b.timestamp.seconds * 1000).toLocaleDateString() : "Recent";
        
        const linkifiedContent = b.content.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
        document.getElementById('modalText').innerHTML = linkifiedContent.replace(/\n/g, '<br>'); 
        document.getElementById('shareBtn').onclick = function() { performShare(b.id, b.title, b.snippet); };

        const newUrl = `${window.location.pathname}?post=${b.id}`;
        window.history.pushState({path: newUrl}, '', newUrl);
        renderComments(b.comments || []);
        document.getElementById('blogModal').style.display = 'flex';
        document.body.style.overflow = 'hidden'; 

        // 👁️ VIEW COUNTER (Works for non-signed in users now!)
        const viewedPosts = JSON.parse(localStorage.getItem('viewed_blogs') || "[]");
        if(!viewedPosts.includes(b.id)) {
            // Optimistic UI Update
            b.views = (b.views || 0) + 1;
            renderBlogs(); 

            // Firebase Update (Needs Rule change in Console)
            const blogRef = doc(db, "blogs", b.id);
            updateDoc(blogRef, { views: increment(1) }).catch(err => {
                console.warn("View record failed. Check Security Rules.", err);
                b.views -= 1; // Rollback UI if failed
                renderBlogs();
            });
            
            viewedPosts.push(b.id);
            localStorage.setItem('viewed_blogs', JSON.stringify(viewedPosts));
        }
    }

    function renderComments(commentsArray) {
        const list = document.getElementById('commentsList');
        document.getElementById('commentCount').innerText = commentsArray.length;
        list.innerHTML = "";
        if(commentsArray.length === 0) {
            list.innerHTML = "<p style='font-size:12px; color:#999; text-align:center;'>No comments yet.</p>";
            return;
        }
        commentsArray.forEach(c => {
            let editBtn = (currentUser && c.uid === currentUser.uid) ? `<i class="fas fa-edit" style="font-size:11px; color:#2d8eff; cursor:pointer; margin-left:8px;" onclick="startEditComment('${c.time}', '${c.text.replace(/'/g, "\\'")}')"></i>` : "";
            list.innerHTML += `
                <div class="comment-card">
                    <img src="${c.userPic || '../img/person.png'}" class="comment-img">
                    <div class="comment-bubble">
                        <div class="comment-name">${c.userName} ${editBtn}</div>
                        <div class="comment-text">${c.text}</div>
                    </div>
                </div>`;
        });
    }

    window.startEditComment = function(timeId, text) {
        editingCommentTime = timeId;
        const input = document.getElementById('commentInput');
        input.value = text;
        input.focus();
    }

    window.postComment = async function() {
        if (!currentUser) {
            if(confirm("Sign in to comment?")) signInWithPopup(auth, provider);
            return;
        }
        const input = document.getElementById('commentInput');
        const text = input.value.trim();
        if(!text || !activeBlogId) return;
        input.value = ""; 
        const blog = allFetchedBlogs.find(b => b.id === activeBlogId);
        try {
            if (editingCommentTime) {
                const idx = blog.comments.findIndex(c => String(c.time) === String(editingCommentTime));
                if(idx > -1) {
                    blog.comments[idx].text = text; 
                    await updateDoc(doc(db, "blogs", activeBlogId), { comments: blog.comments });
                }
                editingCommentTime = null; 
            } else {
                const newComment = { uid: currentUser.uid, userName: currentUser.displayName, userPic: currentUser.photoURL, text: text, time: Date.now() };
                if(!blog.comments) blog.comments = [];
                blog.comments.push(newComment);
                await updateDoc(doc(db, "blogs", activeBlogId), { comments: arrayUnion(newComment) });
            }
            renderComments(blog.comments);
            renderBlogs(); 
        } catch(e) { alert("Comment failed"); }
    }

    window.toggleLike = async function(blogId) {
        if (!currentUser) {
            if(confirm("Sign in to like?")) signInWithPopup(auth, provider);
            return;
        }
        const blog = allFetchedBlogs.find(b => b.id === blogId);
        const isLiked = (blog.likes || []).includes(currentUser.uid);
        blog.likes = isLiked ? blog.likes.filter(id => id !== currentUser.uid) : [...(blog.likes || []), currentUser.uid];
        renderBlogs();
        try {
            const ref = doc(db, "blogs", blogId);
            await updateDoc(ref, { likes: isLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
        } catch(e) { console.error(e); }
    }

    window.performShare = function(blogId, title, snippet) {
        const url = `${window.location.origin}${window.location.pathname}?post=${blogId}`;
        const shareText = `*${title}*\n${snippet}\n\nRead more on AFIT Digital Market:`;
        if (navigator.share) { navigator.share({ title: "AFIT News", text: shareText, url: url }); } 
        else { navigator.clipboard.writeText(`${shareText}\n${url}`).then(() => alert("Link copied!")); }
    }

    window.closeBlogForce = function() {
        document.getElementById('blogModal').style.display = 'none';
        document.body.style.overflow = 'auto'; 
        window.history.pushState({}, '', window.location.pathname);
    }
    
    window.closeBlog = (e) => { if (e.target.id === 'blogModal') closeBlogForce(); }
</script>
</body>
</html>
