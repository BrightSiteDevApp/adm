<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    
    <title>Campus Gist & News | AFIT Digital Market</title>
    
    <meta property="og:title" content="Campus Gist & News | AFIT Digital Market">
    <meta property="og:description" content="Stay updated with the latest Exams, Gossip, and Important Notices from AFIT.">
    <meta property="og:image" content="https://afitdgm.store/img/app-logo.png"> 
    <meta property="og:url" content="https://afitdgm.store/blogs/">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    
     <link rel="icon" href="../img/app-logo.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="../img/app-logo.png">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    
    <style>
        /* Format the blog content to respect new lines */
        .modal-text {
            white-space: pre-wrap; 
            font-family: inherit;
            line-height: 1.6;
            color: #444;
            margin-top: 15px;
        }
        
        /* Ensure images in the grid fit well */
        .blog-thumb {
            object-fit: cover;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            flex-shrink: 0; 
        }

        /* Fix for modal content scrolling */
        .blog-modal-content {
            max-height: 80vh;
            overflow-y: auto;
        }

        /* CSS for Card Share Icon */
        .blog-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .blog-info {
            flex-grow: 1; 
        }
        .card-share-btn {
            padding: 10px;
            color: var(--primary-blue, #2d8eff); 
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0; 
            z-index: 5; 
        }

        /* CSS for Modal Buttons Container */
        .modal-btn-box {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap; 
        }
        .modal-btn-box .chat-btn {
            width: auto !important;
            padding: 12px 25px;
            flex-grow: 1; 
            max-width: 200px; 
        }
    </style>
</head>
<body>

<div id="preloader">
    <div class="loader-content">
        <img src="../img/logo-blue.png" alt="Loading..." class="loader-logo">
        <div class="loading-bar"></div>
    </div>
</div>

<div class="app-container">
    
    <div class="header">
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <span style="font-weight:bold;">Campus Gist</span>
        <div class="notification-icon-box" id="theme-toggle" style="margin-left:auto;">
            <i class="fas fa-moon"></i>
        </div>
    </div>

    <div class="blog-header">
        <h2 style="margin:0;">AFIT Updates</h2>
        <p style="font-size:12px; margin-top:5px; opacity:0.9;">Exams, Gossip, and Important Notices.</p>
    </div>

    <div class="blog-list" id="blog-container">
        </div>

    <div id="no-posts-msg" style="text-align: center; margin-top: 60px; color: #999; display:none;">
        <i class="fas fa-newspaper" style="font-size: 50px; margin-bottom: 15px; opacity: 0.3;"></i>
        <h3 style="font-size: 16px; color: #555;">No Updates Yet</h3>
        <p style="font-size: 12px;">Check back later for news.</p>
    </div>

</div>

<div id="blogModal" class="blog-modal" onclick="closeBlog(event)">
    <div class="blog-modal-content" onclick="event.stopPropagation()">
        <div class="close-blog-btn" onclick="closeBlogForce()"><i class="fas fa-times"></i></div>
        <img id="modalImg" src="" class="modal-hero-img" onerror="this.src='../img/logo-blue.png'">
        <div class="modal-body">
            <h3 id="modalTitle" class="modal-title"></h3>
            <span id="modalDate" class="modal-date" style="font-size:12px; color:#888;"></span>
            <div id="modalText" class="modal-text"></div>
            
            <div class="modal-btn-box">
                <button id="shareBtn" class="chat-btn" style="background: #25D366;">
                    Share <i class="fas fa-share-alt"></i>
                </button>
                <button onclick="closeBlogForce()" class="chat-btn" style="background: #333;">Close</button>
            </div>

        </div>
    </div>
</div>

<script src="../asset/script.js"></script>
<script>
    // --- Configuration ---
    const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4"; 
    const apiURL = `https://opensheet.elk.sh/${sheetID}/Blog`; 

    document.addEventListener("DOMContentLoaded", () => {
        fetch(apiURL)
        .then(res => {
            if(!res.ok) throw new Error("Failed to fetch");
            return res.json();
        })
        .then(data => {
            console.log("Data loaded:", data); 
            
            const container = document.getElementById('blog-container');
            const noMsg = document.getElementById('no-posts-msg');
            const preloader = document.getElementById('preloader');

            // 1. Filter empty rows
            const validPosts = data.filter(p => (p.Title || p.title) && (p.Title || p.title) !== "");

            if (validPosts.length > 0) {
                container.innerHTML = ""; 

                // 2. Reverse to show newest first
                validPosts.reverse().forEach(post => {
                    
                    const title = post.Title || post.title || "Untitled";
                    const snippet = post.Snippet || post.snippet || "Click to read more...";
                    const content = post.Content || post.content || "";
                    
                    let rawDate = post.Timestamp || post.timestamp || "Just Now";
                    if(rawDate.includes(" ")) rawDate = rawDate.split(" ")[0]; 

                    let image = post.Image || post.image || "logo-blue.png";
                    if (!image.startsWith('http')) { image = `../img/${image}`; }

                    // Create Card
                    const div = document.createElement('div');
                    div.className = "blog-card";
                    
                    div.onclick = function() { 
                        openBlogDirect(title, rawDate, image, content); 
                    };
                    
                    div.innerHTML = `
                        <img src="${image}" class="blog-thumb" onerror="this.src='../img/logo-blue.png'">
                        <div class="blog-info">
                            <span class="blog-date">${rawDate}</span>
                            <div class="blog-title">${title}</div>
                            <div class="blog-snippet">${snippet}</div>
                        </div>
                        <div class="card-share-btn">
                            <i class="fas fa-share-alt"></i>
                        </div>
                    `;

                    // Attach click listener to the share icon specifically
                    const shareIconEl = div.querySelector('.card-share-btn');
                    shareIconEl.addEventListener('click', (e) => {
                        e.stopPropagation(); 
                        performShare(title, content);
                    });

                    container.appendChild(div);
                });
                
                if(noMsg) noMsg.style.display = 'none';
            } else {
                if(noMsg) noMsg.style.display = 'block';
            }
            
            if(preloader) preloader.style.display = 'none';
        })
        .catch(err => {
            console.error("Blog Load Error:", err);
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('no-posts-msg').style.display = 'block';
        });
    });

    // 🆕 FIXED Share Function
    function performShare(title, content) {
        // Updated text to "AFIT Digital Market"
        // We REMOVED the URL from here for the native share to avoid double links
        const baseText = `*${title}*\n\n${content.substring(0, 80)}...\n\nRead full gist on AFIT Digital Market:`;
            
        if (navigator.share) {
            navigator.share({
                title: "AFIT Campus Gist",
                text: baseText, 
                url: window.location.href // Browser will attach this automatically
            }).catch(console.error);
        } else {
            // Fallback to WhatsApp (Manual Open)
            // Here we MUST add the URL manually because we are building the link string
            const waText = `${baseText}\n${window.location.href}`;
            const waUrl = `https://wa.me/?text=${encodeURIComponent(waText)}`;
            window.open(waUrl, '_blank');
        }
    }

    // --- Modal Functions ---

    function openBlogDirect(title, date, img, content) {
        document.getElementById('modalImg').src = img;
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalDate').innerText = date;
        document.getElementById('modalText').innerText = content; 
        
        const shareBtn = document.getElementById('shareBtn');
        shareBtn.onclick = function() {
            performShare(title, content);
        };

        const modal = document.getElementById('blogModal');
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden'; 
    }

    function closeBlogForce() {
        document.getElementById('blogModal').style.display = 'none';
        document.body.style.overflow = 'auto'; 
    }

    function closeBlog(event) {
        if (event.target.id === 'blogModal') closeBlogForce();
    }
</script>

</body>
</html>
