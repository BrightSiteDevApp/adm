<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - AFIT Market</title>
    <link rel="stylesheet" href="asset/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png">
    
    <style>
        body { background-color: #f4f7f6; font-family: sans-serif; padding-bottom: 50px; }
        .admin-header {
            background: #2d3436;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
        }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        
        .section-title { margin: 30px 0 15px; color: #555; border-bottom: 2px solid #ddd; padding-bottom: 10px; }

        /* VENDOR LIST STYLES */
        .vendor-list { display: flex; flex-direction: column; gap: 10px; }
        .vendor-row {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 15px 20px; border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #00b894;
        }
        .vendor-row.suspended { border-left: 5px solid #d63031; background: #ffecec; opacity: 0.8; }
        .btn-action { padding: 8px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-suspend { background: #fff5f5; color: #d63031; border: 1px solid #d63031; }
        .btn-unsuspend { background: #00b894; color: white; }

        /* FLASH SALE GRID STYLES */
        .flash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .flash-card {
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 15px;
        }
        .flash-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; background: #eee; }
        .flash-info { flex: 1; }
        .flash-title { font-size: 14px; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .flash-meta { font-size: 11px; color: #777; margin-top: 3px; }

        /* TOGGLE SWITCH */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2d8eff; }
        input:checked + .slider:before { transform: translateX(18px); }

        #loading { margin-top: 50px; color: #555; }
    </style>
</head>
<body>

    <div class="admin-header">
        <div>
            <h3 style="margin:0;">⚡ Super Admin</h3>
            <div style="font-size:11px; opacity:0.8; letter-spacing:1px;">COMMAND CENTER</div>
        </div>
        <a href="index.html" style="color:white; text-decoration:none; border:1px solid white; padding:5px 15px; border-radius:20px; font-size:12px;">Exit</a>
    </div>

    <div id="loading" style="text-align:center;">
        <i class="fas fa-spinner fa-spin" style="font-size:30px; margin-bottom:15px;"></i>
        <div>Verifying Clearance...</div>
    </div>

    <div id="admin-content" class="container" style="display:none;">
        
        <h4 class="section-title"><i class="fas fa-users-cog"></i> Vendor Management</h4>
        <div class="vendor-list" id="vendor-list">
            </div>

        <h4 class="section-title" style="margin-top: 40px;"><i class="fas fa-bolt" style="color:#f1c40f;"></i> Flash Sale Manager</h4>
        <input type="text" id="product-search" placeholder="Search items..." style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; border-radius:8px;">
        <div class="flash-grid" id="flash-list">
            <p>Loading products...</p>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
            authDomain: "afit-market-auth.firebaseapp.com",
            projectId: "afit-market-auth",
            storageBucket: "afit-market-auth.firebasestorage.app",
            messagingSenderId: "894920886640",
            appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "afitdgm@gmail.com"; 
        const SHEET_API = "https://opensheet.elk.sh/1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4/Vendors";
        let allProducts = []; // Store locally for search

        onAuthStateChanged(auth, async (user) => {
            const loader = document.getElementById('loading');
            
            if (user) {
                if (user.email.toLowerCase().trim() === ADMIN_EMAIL.toLowerCase().trim()) {
                    loader.innerHTML = '<i class="fas fa-check-circle" style="color:green; font-size:30px;"></i><br><br>Access Granted.';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        document.getElementById('admin-content').style.display = 'block';
                        loadVendors();
                        loadProducts(); // Load Flash Sale Items
                    }, 800);
                } else {
                    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>⛔ ACCESS DENIED</h2>";
                }
            } else {
                signInWithPopup(auth, provider).catch(() => window.location.href = "index.html");
            }
        });

        // --- 1. VENDOR LOGIC ---
        async function loadVendors() {
            const list = document.getElementById('vendor-list');
            try {
                const res = await fetch(SHEET_API);
                const vendors = await res.json();
                const snapshot = await getDocs(collection(db, "vendor_status"));
                const statusMap = {};
                snapshot.forEach(doc => { statusMap[doc.id] = doc.data().status; });

                list.innerHTML = "";
                vendors.forEach(v => {
                    const vid = v.vendor_id || v.Vendor_ID;
                    const name = v.business_name || v.Business_Name;
                    const isSuspended = statusMap[vid] === "suspended";
                    
                    list.innerHTML += `
                        <div class="vendor-row ${isSuspended ? 'suspended' : ''}">
                            <div class="v-info">
                                <h4 class="v-name">${name}</h4>
                                <p style="font-size:11px; margin-top:2px;">ID: ${vid}</p>
                            </div>
                            <button class="btn-action ${isSuspended ? 'btn-unsuspend' : 'btn-suspend'}" 
                                    onclick="toggleSuspend('${vid}', ${isSuspended}, '${name}')">
                                ${isSuspended ? 'Unsuspend' : 'Suspend'}
                            </button>
                        </div>`;
                });
            } catch (err) { console.error("Vendor Load Error", err); }
        }

        window.toggleSuspend = async function(vid, currentlySuspended, vName) {
            const newStatus = currentlySuspended ? "active" : "suspended";
            if(!confirm(`Change ${vName} to ${newStatus}?`)) return;
            try {
                await setDoc(doc(db, "vendor_status", vid), { status: newStatus }, { merge: true });
                alert("Status updated!");
                loadVendors();
            } catch(e) { alert("Error: " + e.message); }
        };

        // --- 2. FLASH SALE LOGIC ---
        async function loadProducts() {
            const grid = document.getElementById('flash-list');
            grid.innerHTML = "<p>Fetching inventory...</p>";
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                
                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    allProducts.push({ id: doc.id, ...d });
                });

                renderFlashList(allProducts);

            } catch (err) {
                console.error(err);
                grid.innerHTML = "<p style='color:red;'>Error loading items.</p>";
            }
        }

        function renderFlashList(items) {
            const grid = document.getElementById('flash-list');
            grid.innerHTML = "";

            if(items.length === 0) {
                grid.innerHTML = "<p>No items found.</p>";
                return;
            }

            items.forEach(item => {
                const isStory = item.is_story === "true";
                const img = item.image.startsWith('http') ? item.image : `img/${item.image}`;
                
                grid.innerHTML += `
                <div class="flash-card">
                    <img src="${img}" class="flash-img" onerror="this.src='img/logo-blue.png'">
                    <div class="flash-info">
                        <div class="flash-title">${item.name}</div>
                        <div class="flash-meta">${item.price} • ${item.vendor_id}</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" ${isStory ? 'checked' : ''} onchange="toggleStory('${item.id}', this)">
                        <span class="slider"></span>
                    </label>
                </div>`;
            });
        }

        // TOGGLE FLASH SALE FUNCTION
        window.toggleStory = async function(docID, checkbox) {
            const newState = checkbox.checked ? "true" : "false";
            try {
                const productRef = doc(db, "products", docID);
                await updateDoc(productRef, {
                    is_story: newState
                });
                console.log(`Item ${docID} updated to is_story: ${newState}`);
                // Optional: Show a tiny toast notification
            } catch (error) {
                console.error("Update failed:", error);
                alert("Failed to update status. Check console.");
                checkbox.checked = !checkbox.checked; // Revert switch if failed
            }
        };

        // SEARCH FILTER
        document.getElementById('product-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(term) || p.vendor_id.toLowerCase().includes(term));
            renderFlashList(filtered);
        });

    </script>
</body>
</html>
