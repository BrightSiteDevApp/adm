<!DOCTYPE html>
<html>
<head>
    <title>Test Chat Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }</style>
</head>
<body>
    <h2>Chat Tester</h2>
    <p>Clicking this will simulate a Customer starting a chat with you (the Vendor).</p>
    
    <input type="text" id="target-vendor-uid" placeholder="Enter YOUR Vendor UID" style="padding: 10px; width: 300px; margin-bottom: 10px;"><br>
    
    <button onclick="startFakeChat()" style="padding: 15px 30px; background: #2d8eff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
        Generate Test Chat
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // YOUR CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
            authDomain: "afit-market-auth.firebaseapp.com",
            projectId: "afit-market-auth"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let myUid = null;
        let myName = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                myUid = user.uid;
                myName = user.displayName || "Test Customer";
                // Auto-fill the input with your own UID just for easy self-testing
                document.getElementById('target-vendor-uid').value = myUid; 
            } else {
                alert("You must be logged in to test this!");
                window.location.href = "login.html";
            }
        });

        window.startFakeChat = async function() {
            const vendorUid = document.getElementById('target-vendor-uid').value.trim();
            if(!vendorUid) return alert("Enter a Vendor UID");

            try {
                // Set the 3-day expiration
                const expirationDate = new Date();
                expirationDate.setDate(expirationDate.getDate() + 3);

                // Generate the chat document
                const chatRef = await addDoc(collection(db, "chats"), {
                    participants: [myUid, vendorUid], // Both people in the chat
                    customerUid: myUid,
                    customerName: myName,
                    vendorUid: vendorUid,
                    vendorName: "AFIT Gadget Store", // Fake vendor name
                    vendorEmail: "test@afitdgm.store", 
                    productName: "iPhone 13 Pro Max", // Fake product
                    lastMessage: "Chat started...",
                    updatedAt: serverTimestamp(),
                    expiresAt: expirationDate
                });

                // Redirect to the new chat room
                window.location.href = `chat/index.html?id=${chatRef.id}`;
            } catch(e) {
                console.error(e);
                alert("Failed to create test chat.");
            }
        }
    </script>
</body>
</html>
