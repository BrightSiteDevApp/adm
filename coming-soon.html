<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon | AFIT Digital Market</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="img/app-logo.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

        :root {
            --brand: #2d8eff; /* Your Brand Color */
            --dark-bg: #0b1120;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
            /* Professional Dark Brand Background */
            background: radial-gradient(circle at top left, #1e3a8a, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #333;
        }

        /* Animated Background Mesh */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.3;
            background-image: linear-gradient(#2d8eff 1px, transparent 1px),
                              linear-gradient(90deg, #2d8eff 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
        }

        .container {
            background: var(--glass);
            width: 100%;
            max-width: 450px;
            padding: 35px 25px;
            border-radius: 24px;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 10px rgba(45, 142, 255, 0.2));
        }

        .status-badge {
            background: #e0f2fe;
            color: var(--brand);
            border: 1px solid #bae6fd;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 25px 0;
        }

        /* --- FIXED INPUT LAYOUT --- */
        .input-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Keeps button to the right */
            background: #f1f5f9;
            border-radius: 50px; /* Pill shape */
            padding: 4px 4px 4px 15px; /* Padding for text input */
            border: 2px solid transparent;
            transition: 0.3s;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        .input-wrapper:focus-within {
            background: #fff;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(45, 142, 255, 0.15);
        }

        .email-input {
            flex-grow: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            color: #333;
            min-width: 0; /* Prevents input from breaking flex */
        }

        .notify-btn {
            background: var(--dark-bg);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0; /* CRITICAL FIX: Prevents button shrinking */
            white-space: nowrap; /* Keeps text on one line */
            transition: 0.2s;
        }
        .notify-btn:active { transform: scale(0.95); }

        /* --- BUTTON GRID --- */
        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn:active { transform: scale(0.96); }

        .btn-contact {
            background: white;
            color: #25D366;
            border: 1px solid #25D366;
        }
        
        .btn-vendor {
            background: white;
            color: #333;
            border: 1px solid #cbd5e1;
        }

        /* --- INSTALL APP --- */
        #install-container {
            display: none;
            margin-top: 10px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .install-btn {
            width: 100%;
            background: var(--brand); /* Brand Blue */
            color: white;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(45, 142, 255, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(45, 142, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(45, 142, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(45, 142, 255, 0); }
        }

        /* --- IOS MESSAGE --- */
        #ios-install-message {
            display: none;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: left;
        }
        .ios-title { font-weight: 700; font-size: 12px; margin-bottom: 5px; color: #334155; }
        .ios-text { font-size: 11px; color: #64748b; margin: 0; line-height: 1.5; }

    </style>
</head>
<body>

    <div class="bg-mesh"></div>

    <div class="container">
        
        <img src="img/logo-blue.png" alt="ADM" class="logo">

        <div>
            <span class="status-badge">● Under Construction</span>
        </div>

        <h1>AFIT Digital Market</h1>
        <p>The ultimate student marketplace is leveling up. Join the waitlist to get early access.</p>

        <form action="https://formsubmit.co/afitdgm@gmail.com" method="POST">
            <div class="input-wrapper">
                <input type="email" name="email" class="email-input" placeholder="Enter your email" required>
                <input type="hidden" name="_next" value="https://afitdgm.store/coming-soon.html">
                <input type="hidden" name="_captcha" value="false">
                <button type="submit" class="notify-btn">Notify Me</button>
            </div>
        </form>

        <div class="grid-buttons">
            <a href="https://wa.me/2349153375488" class="btn btn-contact">
                <i class="fab fa-whatsapp"></i> Support
            </a>
            <button onclick="promptVendorCode()" class="btn btn-vendor">
                <i class="fas fa-lock"></i> Vendor Login
            </button>
        </div>

        <div id="install-container">
            <button id="install-btn" class="install-btn">
                <i class="fas fa-download"></i> Install App
            </button>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 8px;">Get ready for launch day</div>
        </div>

        <div id="ios-install-message">
            <div class="ios-title"> Install on iPhone</div>
            <p class="ios-text">
                1. Tap the <strong>Share</strong> button <i class="fas fa-share-square"></i> below.<br>
                2. Select <strong>"Add to Home Screen"</strong> <i class="far fa-plus-square"></i>.
            </p>
        </div>

    </div>

    <script>
        // --- VENDOR ACCESS ---
        function promptVendorCode() {
            const code = prompt("Enter Vendor Access Code:");
            if (code === "1020") {
                window.location.href = "https://afitdgm.store/?access=vendor";
            } else if (code !== null && code !== "") {
                alert("⛔ Access Denied: Incorrect Code.");
            }
        }

        // --- PWA LOGIC ---
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        if (isIos) {
            document.getElementById('ios-install-message').style.display = 'block';
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('✅ SW Registered'))
                .catch(() => console.log('❌ SW Failed'));
        }

        let deferredPrompt;
        const installContainer = document.getElementById('install-container');
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!isIos) {
                installContainer.style.display = 'block';
            }
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installContainer.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            installContainer.style.display = 'none';
        });
    </script>
</body>
</html>
