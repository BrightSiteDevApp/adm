<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | AFIT Digital Market</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d8eff">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="img/app-logo.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Background Shapes */
        .shape {
            position: absolute;
            filter: blur(50px);
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }
        .shape-1 { top: 10%; left: 10%; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.3); border-radius: 50%; }
        .shape-2 { bottom: 20%; right: 10%; width: 150px; height: 150px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; animation-delay: 1s; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* Glassmorphism Container */
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo-box {
            background: white;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .logo {
            width: 60px;
            object-fit: contain;
        }

        h1 { 
            margin: 0; 
            font-size: 28px; 
            font-weight: 800;
            color: #2d3436; 
            letter-spacing: -0.5px;
        }
        
        p { 
            color: #636e72; 
            line-height: 1.6; 
            margin-top: 10px; 
            font-size: 14px;
        }

        .badge {
            background: #ffeaa7;
            color: #d63031;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(255, 234, 167, 0.5);
        }

        /* NOTIFY SECTION */
        .notify-box {
            margin-top: 25px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
        }
        
        .notify-label {
            font-size: 13px;
            font-weight: 700;
            color: #2d8eff;
            display: block;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .input-group {
            position: relative;
            display: flex;
            background: white;
            border-radius: 50px;
            padding: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .email-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            outline: none;
            font-size: 13px;
            background: transparent;
            font-family: inherit;
        }

        .notify-btn {
            background: #2d3436;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: transform 0.2s;
        }
        .notify-btn:active { transform: scale(0.95); }

        /* BUTTONS GRID */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn:active { transform: scale(0.98); }

        .btn-whatsapp {
            background: #e6fffa;
            color: #25D366;
            border: 1px solid #25D366;
        }
        .btn-vendor {
            background: #2d3436;
            color: white;
        }

        /* INSTALL APP SECTION */
        #install-container {
            display: none;
            margin-top: 20px;
        }
        .install-btn {
            background: linear-gradient(135deg, #2d8eff, #6c5ce7);
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 8px 20px rgba(45, 142, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* IOS INSTRUCTIONS */
        #ios-install-message {
            display: none;
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #ffeeba;
            text-align: left;
        }
        .ios-instructions {
            font-size: 11px;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="container">
        <div class="logo-box">
            <img src="img/logo-blue.png" alt="ADM Logo" class="logo">
        </div>

        <span class="badge">🚧 Under Construction</span>
        <h1>AFIT Digital Market</h1>
        <p>We are building the ultimate marketplace for AFIT students. Something huge is coming!</p>
        
        <div class="notify-box">
            <span class="notify-label">🚀 Get notified when we launch</span>
            <form action="https://formsubmit.co/afitdgm@gmail.com" method="POST" class="input-group">
                <input type="email" name="email" class="email-input" placeholder="Enter your email address" required>
                <input type="hidden" name="_next" value="https://afitdgm.store/coming-soon.html">
                <input type="hidden" name="_captcha" value="false">
                <button type="submit" class="notify-btn">Notify Me</button>
            </form>
        </div>

        <div class="action-grid">
            <a href="https://wa.me/2349153375488" class="btn btn-whatsapp">
                <i class="fab fa-whatsapp"></i> Contact
            </a>
            <button onclick="promptVendorCode()" class="btn btn-vendor">
                <i class="fas fa-lock"></i> Vendor Login
            </button>
        </div>

        <div id="install-container">
            <p style="font-size: 11px; color: #666; margin-bottom: 10px; margin-top: 15px;">Don't miss the launch!</p>
            <button id="install-btn" class="install-btn">
                <i class="fas fa-download"></i> Install App Now
            </button>
        </div>

        <div id="ios-install-message">
            <p class="ios-instructions">
                <strong>📲 Install on iPhone:</strong><br>
                1. Tap the <strong>Share</strong> button <i class="fas fa-share-square"></i> at the bottom.<br>
                2. Scroll down and tap <strong>"Add to Home Screen"</strong> <i class="far fa-plus-square"></i>.
            </p>
        </div>
    </div>

    <script>
        // --- VENDOR LOGIN LOGIC ---
        function promptVendorCode() {
            const code = prompt("Enter Vendor Access Code:");
            if (code === "1020") {
                window.location.href = "https://afitdgm.store/?access=vendor";
            } else if (code !== null) {
                alert("⛔ Access Denied: You are not a verified vendor.");
            }
        }

        // 1. Check if user is on iPhone/iPad to show instructions
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIos) {
            document.getElementById('ios-install-message').style.display = 'block';
        }

        // 2. Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('✅ Service Worker Registered'))
                .catch(err => console.log('❌ SW Failed:', err));
        }

        // 3. Handle Install Prompt (Android/Desktop)
        let deferredPrompt;
        const installContainer = document.getElementById('install-container');
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!isIos) {
                installContainer.style.display = 'block';
            }
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installContainer.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            installContainer.style.display = 'none';
            console.log('App Installed Successfully');
        });
    </script>
</body>
</html>
