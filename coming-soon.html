<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | AFIT Digital Market</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d3436">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png" type="image/png" sizes="32x32">
    <link rel="icon" href="img/app-logo.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="img/app-logo.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        .logo {
            width: 80px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: #2d3436; }
        p { color: #636e72; line-height: 1.6; margin-top: 10px; }
        .badge {
            background: #ffeaa7;
            color: #d63031;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        
        /* NOTIFY SECTION */
        .notify-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .notify-label {
            font-size: 14px;
            font-weight: 600;
            color: #2d3436;
            display: block;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            gap: 5px;
        }
        .email-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            font-size: 13px;
        }
        .email-input:focus {
            border-color: #25D366;
        }
        .notify-btn {
            background: #2d3436;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        /* CONTACT BUTTON */
        .social-btn {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            background: #25D366;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- INSTALL APP BUTTON STYLES --- */
        #install-container {
            display: none; /* Hidden by default, shown by JS */
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
        }
        .install-btn {
            background: #2d8eff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(45, 142, 255, 0.3);
            transition: transform 0.2s;
        }
        .install-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="img/logo-blue.png" alt="ADM Logo" class="logo">
        <br>
        <span class="badge">🚧 UNDER CONSTRUCTION</span>
        <h1>AFIT Digital Market</h1>
        <p>We are upgrading the platform to serve you better. The full marketplace will launch soon!</p>
        
        <div class="notify-box">
            <span class="notify-label">🚀 Get notified when we launch!</span>
            <form action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST" class="input-group">
                <input type="email" name="email" class="email-input" placeholder="Enter your email" required>
                <input type="hidden" name="_next" value="https://afitdgm.store/coming-soon.html">
                <input type="hidden" name="_captcha" value="false">
                <button type="submit" class="notify-btn">Notify Me</button>
            </form>
            <p style="font-size: 11px; color: #999; margin-top: 8px;">We promise not to spam you.</p>
        </div>

        <a href="https://wa.me/2349153375488" class="social-btn">
            <i class="fab fa-whatsapp"></i> Contact Admin
        </a>

        <div id="install-container">
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Get the App ready for launch day!</p>
            <button id="install-btn" class="install-btn">
                <i class="fas fa-download"></i> Install App
            </button>
        </div>
    </div>

<div id="debug-console" style="background: #000; color: #0f0; padding: 10px; margin-top: 20px; font-family: monospace; font-size: 10px; text-align: left; border-radius: 8px; display: block;">
        Debug Log:<br>
    </div>

    <script>
        // 1. Redirect Console Logs to the Screen
        const debugBox = document.getElementById('debug-console');
        function logToScreen(msg) {
            debugBox.innerHTML += `> ${msg}<br>`;
            console.log(msg);
        }

        logToScreen("Initializing PWA Check...");

        // 2. Check if Manifest exists
        fetch('manifest.json')
            .then(res => {
                if(res.status === 200) logToScreen("✅ Manifest found!");
                else logToScreen("❌ Manifest file NOT found (404). Check file name/location.");
            })
            .catch(err => logToScreen("❌ Manifest Error: " + err));

        // 3. Register Service Worker
        if ('serviceWorker' in navigator) {
            // Using './sw.js' forces it to look in the CURRENT folder
            navigator.serviceWorker.register('./sw.js') 
                .then(reg => {
                    logToScreen("✅ Service Worker Registered. Scope: " + reg.scope);
                })
                .catch(err => {
                    logToScreen("❌ SW Failed: " + err.message);
                    logToScreen("⚠️ Is sw.js in the same folder as this HTML file?");
                });
        } else {
            logToScreen("❌ Service Worker not supported in this browser.");
        }

        // 4. Handle Install Prompt
        let deferredPrompt;
        const installContainer = document.getElementById('install-container');
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            logToScreen("✅ beforeinstallprompt Event FIRED! (Button should show)");
            e.preventDefault();
            deferredPrompt = e;
            installContainer.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                logToScreen(`User choice: ${outcome}`);
                deferredPrompt = null;
                installContainer.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            logToScreen("✅ App Installed Successfully");
            installContainer.style.display = 'none';
        });

        // 5. Check if already installed
        if (window.matchMedia('(display-mode: standalone)').matches) {
            logToScreen("ℹ️ App is already running in PWA mode.");
        }
    </script>

    
</body>
</html>
