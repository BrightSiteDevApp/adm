<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon | AFIT Digital Market</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="img/app-logo.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

        :root {
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --dark: #0f172a;
            --light: #ffffff;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
            background-color: var(--dark);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh; /* Fixes mobile cutoff */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: var(--dark);
        }

        /* Animated Background Mesh */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.6;
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        }

        .container {
            background: var(--glass);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .status-badge {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fda4af;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #2563eb, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 25px 0;
        }

        /* --- MODERN INPUT --- */
        .notify-form {
            position: relative;
            margin-bottom: 30px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 16px;
            padding: 5px;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .input-wrapper:focus-within {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .email-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 15px;
            font-size: 14px;
            outline: none;
            color: var(--dark);
            font-family: inherit;
        }

        .notify-btn {
            background: var(--dark);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .notify-btn:hover { transform: scale(1.02); background: #000; }
        .notify-btn:active { transform: scale(0.95); }

        /* --- BUTTON GRID --- */
        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn:active { transform: scale(0.96); }

        .btn-contact {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        
        .btn-vendor {
            background: white;
            color: var(--dark);
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* --- INSTALL APP --- */
        #install-container {
            display: none;
            margin-top: 10px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .install-btn {
            width: 100%;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            color: white;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* --- IOS MESSAGE --- */
        #ios-install-message {
            display: none;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 16px;
            margin-top: 20px;
            text-align: left;
        }
        .ios-title { font-weight: 700; font-size: 13px; margin-bottom: 5px; color: #334155; }
        .ios-text { font-size: 12px; color: #64748b; margin: 0; line-height: 1.5; }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 380px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 26px; }
            .grid-buttons { grid-template-columns: 1fr; } /* Stack buttons on very small screens */
        }
    </style>
</head>
<body>

    <div class="bg-mesh"></div>

    <div class="container">
        
        <div class="logo-wrapper">
            <img src="img/logo-blue.png" alt="ADM" class="logo">
        </div>

        <div>
            <span class="status-badge">● Under Construction</span>
        </div>

        <h1>AFIT Digital Market</h1>
        <p>The ultimate student marketplace is leveling up. Join the waitlist to get early access.</p>

        <form action="https://formsubmit.co/afitdgm@gmail.com" method="POST" class="notify-form">
            <div class="input-wrapper">
                <input type="email" name="email" class="email-input" placeholder="Enter your email..." required>
                <input type="hidden" name="_next" value="https://afitdgm.store/coming-soon.html">
                <input type="hidden" name="_captcha" value="false">
                <button type="submit" class="notify-btn">Notify Me</button>
            </div>
        </form>

        <div class="grid-buttons">
            <a href="https://wa.me/2349153375488" class="btn btn-contact">
                <i class="fab fa-whatsapp"></i> Support
            </a>
            <button onclick="promptVendorCode()" class="btn btn-vendor">
                <i class="fas fa-lock"></i> Vendor Login
            </button>
        </div>

        <div id="install-container">
            <button id="install-btn" class="install-btn">
                <i class="fas fa-download"></i> Install App
            </button>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 8px;">Get ready for launch day</div>
        </div>

        <div id="ios-install-message">
            <div class="ios-title"> Install on iPhone</div>
            <p class="ios-text">
                1. Tap the <strong>Share</strong> button <i class="fas fa-share-square"></i> below.<br>
                2. Select <strong>"Add to Home Screen"</strong> <i class="far fa-plus-square"></i>.
            </p>
        </div>

    </div>

    <script>
        // --- VENDOR ACCESS ---
        function promptVendorCode() {
            const code = prompt("Enter Vendor Access Code:");
            // Check strictly for "1020"
            if (code === "1020") {
                window.location.href = "https://afitdgm.store/?access=vendor";
            } else if (code !== null && code !== "") {
                alert("⛔ Access Denied: Incorrect Code.");
            }
        }

        // --- PWA LOGIC ---
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        // 1. Show iOS Instructions
        if (isIos) {
            document.getElementById('ios-install-message').style.display = 'block';
        }

        // 2. Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('✅ SW Registered'))
                .catch(() => console.log('❌ SW Failed'));
        }

        // 3. Android Install Prompt
        let deferredPrompt;
        const installContainer = document.getElementById('install-container');
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Show install button only if NOT iOS
            if (!isIos) {
                installContainer.style.display = 'block';
            }
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installContainer.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            installContainer.style.display = 'none';
        });
    </script>
</body>
</html>
