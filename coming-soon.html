<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | AFIT Digital Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png" type="image/png" sizes="32x32">
    <link rel="icon" href="img/app-logo.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="img/app-logo.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .logo {
            width: 80px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: #2d3436; }
        p { color: #636e72; line-height: 1.6; margin-top: 10px; }
        .badge {
            background: #ffeaa7;
            color: #d63031;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        
        /* --- NEW NOTIFY SECTION STYLES --- */
        .notify-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .notify-label {
            font-size: 14px;
            font-weight: 600;
            color: #2d3436;
            display: block;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            gap: 5px;
        }
        .email-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            font-size: 13px;
        }
        .email-input:focus {
            border-color: #25D366;
        }
        .notify-btn {
            background: #2d3436;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .social-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #25D366;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            width: 100%; /* Made full width for better look */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="img/logo-blue.png" alt="ADM Logo" class="logo">
        <br>
        <span class="badge">🚧 UNDER CONSTRUCTION</span>
        <h1>AFIT Digital Market</h1>
        <p>We are currently upgrading the platform to serve you better. The full marketplace will launch soon!</p>
        
        <div class="notify-box">
            <span class="notify-label">🚀 Want to be the first to know when we launch?</span>
            
            <form action="https://formsubmit.co/afitdgm@gmail.com" method="POST" class="input-group">
                <input type="email" name="email" class="email-input" placeholder="Enter your email address" required>
                <input type="hidden" name="_next" value="https://afitdgm.store/coming-soon.html">
                <input type="hidden" name="_captcha" value="false">
                <button type="submit" class="notify-btn">Notify Me</button>
            </form>
            
            <p style="font-size: 11px; color: #999; margin-top: 8px;">We promise not to spam you.</p>
        </div>

        <a href="https://wa.me/2349153375488" class="social-btn">
            <i class="fab fa-whatsapp"></i> Contact Admin
        </a>
    </div>
</body>
</html>
