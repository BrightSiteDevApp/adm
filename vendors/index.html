  <script>
    document.addEventListener("DOMContentLoaded", () => {
        const searchInput = document.getElementById('vendor-search');
        const container = document.getElementById('all-vendors-container');

        // 1. SHUFFLE LOGIC
        if (container) {
            const cards = Array.from(container.children);
            
            // Shuffle
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            
            // Re-append shuffled cards
            container.innerHTML = "";
            cards.forEach(card => container.appendChild(card));
        }

        // 2. SEARCH LOGIC
        if (searchInput && container) {
            // Close keyboard on enter
            searchInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') searchInput.blur();
            });

            // Filter logic
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const vendors = container.querySelectorAll('.vendor-card');

                vendors.forEach(card => {
                    const name = card.querySelector('.vendor-name').innerText.toLowerCase();
                    const id = card.querySelector('.vendor-id').innerText.toLowerCase();

                    if (name.includes(query) || id.includes(query)) {
                        card.style.display = ""; // Show
                    } else {
                        card.style.display = "none"; // Hide
                    }
                });
            });
        }
    });
  </script>
