<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>Vendor Storefront | AFIT Digital Market</title>

    <meta property="og:title" content="Vendor Storefront | AFIT Digital Market">
    <meta property="og:description" content="Tap to view this vendor's items, check their prices, and chat with them directly on AFIT Digital Market.">
    <meta property="og:image" content="https://afitdgm.store/img/app-logo.png">
    <meta property="og:type" content="website">

    <script>
        // 1. Grab whatever is after the "?" in the URL (e.g., "V005")
        const vendorId = window.location.search.substring(1);
        
        // 2. If an ID exists, instantly redirect them to the real profile page
        if (vendorId) {
            window.location.replace(`../profile.html?vendor=${vendorId}`);
        } else {
            // If they just typed afitdgm.store/v/ with no ID, send them to the vendors page
            window.location.replace(`../vendors/`);
        }
    </script>
</head>
<body style="background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #777;">
    <p>Loading storefront...</p>
</body>
</html>
