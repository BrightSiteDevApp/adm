<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>All Items - AFIT Market</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../asset/style.css">
  <link rel="icon" href="../img/app-logo.png">
</head>
<body>

  <div class="app-container">
    <div class="header">
      <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <span style="font-weight:bold;">All Available Items</span>
    </div>

    <div class="cat-search-container">
        <div class="search-wrapper cat-search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="item-search" class="search-input" placeholder="Search for anything...">
        </div>
    </div>

    <div class="trending-grid" id="all-items-container" style="padding: 15px;">
        
        <div class="skeleton-card">
            <div class="skeleton sk-img-rect"></div>
            <div class="skeleton sk-text-short"></div>
            <div class="skeleton sk-text-long"></div>
            <div class="skeleton sk-btn"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton sk-img-rect"></div>
            <div class="skeleton sk-text-short"></div>
            <div class="skeleton sk-text-long"></div>
            <div class="skeleton sk-btn"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton sk-img-rect"></div>
            <div class="skeleton sk-text-short"></div>
            <div class="skeleton sk-text-long"></div>
            <div class="skeleton sk-btn"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton sk-img-rect"></div>
            <div class="skeleton sk-text-short"></div>
            <div class="skeleton sk-text-long"></div>
            <div class="skeleton sk-btn"></div>
        </div>

    </div>

    <footer class="site-footer">
        <p style="margin-top:10px; color:#777;">&copy; 2026 BrightSiteDev</p>
    </footer>
  </div>

  <script src="../asset/script.js"></script>

 <script>
    const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4";
    const apiRoot = `https://opensheet.elk.sh/${sheetID}`;
    const ADMIN_PHONE = "2348144516127"; 

    function shuffle(array) { return array.sort(() => 0.5 - Math.random()); }

    document.addEventListener("DOMContentLoaded", () => {
        // Fetch Vendors first
        fetch(`${apiRoot}/Vendors`)
        .then(res => res.json())
        .then(vendors => {
            const phoneBook = {};
            vendors.forEach(v => {
                const vID = v.vendor_id || v.Vendor_ID;
                const vPhone = v.whatsapp || v.Whatsapp;
                if(vID) phoneBook[vID] = String(vPhone).replace(/[^0-9]/g, '');
            });

            // Fetch Products
            return fetch(`${apiRoot}/Products`)
                .then(res => res.json())
                .then(products => ({ products, phoneBook }));
        })
        .then(({ products, phoneBook }) => {
            const container = document.getElementById('all-items-container');
            container.innerHTML = ""; 

            const available = products.filter(p => (p.status || p.Status) !== "Sold");
            const shuffled = shuffle(available);

            if(shuffled.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding:20px; color:#777;'>No items found.</p>";
                return;
            }

            shuffled.forEach(p => {
                const pName = p.name || p.Name;
                const pPrice = p.price || p.Price;
                const pDesc = p.description || p.Description || ""; // NEW
                const pVendor = p.vendor_id || p.Vendor_ID;
                const pImage = p.image || p.Image;

                const img = pImage.startsWith('http') ? pImage : `../img/${pImage}`;
                const vendorPhone = phoneBook[pVendor] || ADMIN_PHONE;
                const waLink = `https://wa.me/${vendorPhone}?text=${encodeURIComponent(`Hi, I saw "${pName}" on AFIT Market. Is it available?`)}`;

                container.innerHTML += `
                <div class="ad-card">
                    <img class="ad-img" src="${img}" alt="${pName}" onerror="this.src='../img/logo-blue.png'">
                    <div class="ad-info">
                        <div class="ad-price">${pPrice}</div>
                        <div class="ad-title">${pName}</div>
                        <div class="ad-desc">${pDesc}</div> <div class="ad-location">Vendor: ${pVendor}</div>
                        <a href="${waLink}" class="chat-btn" target="_blank">Get Item</a>
                    </div>
                </div>`;
            });

            const searchInput = document.getElementById('item-search');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    document.querySelectorAll('.ad-card').forEach(card => {
                        const title = card.querySelector('.ad-title').innerText.toLowerCase();
                        card.style.display = title.includes(query) ? "" : "none";
                    });
                });
            }
        })
        .catch(err => console.error(err));
    });
</script>
</body>
</html>
