  <script>
    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById('all-items-container');
        const searchInput = document.getElementById('main-search');
        
        // 1. SHUFFLE LOGIC
        if (container) {
            const cards = Array.from(container.children);
            
            // Shuffle
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            
            // Re-append shuffled cards
            container.innerHTML = "";
            cards.forEach(card => container.appendChild(card));
        }

        // 2. SEARCH LOGIC & KEYBOARD FIX
        if (searchInput && container) {
            
            // A. Real-time Search
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const cards = container.querySelectorAll('.ad-card');

                cards.forEach(card => {
                    const title = card.querySelector('.ad-title').innerText.toLowerCase();
                    const location = card.querySelector('.ad-location').innerText.toLowerCase();

                    if (title.includes(query) || location.includes(query)) {
                        card.style.display = ""; // Show
                    } else {
                        card.style.display = "none"; // Hide
                    }
                });
            });

            // B. Close Keyboard on "Enter"
            searchInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    searchInput.blur(); // This command closes the mobile keyboard
                }
            });
        }
    });
  </script>
