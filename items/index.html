<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Items - AFIT Market</title>
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="icon" href="../img/app-logo.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="../img/app-logo.png">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <style>
        /* Filter Bar Styles */
        .filter-container {
            background: white;
            padding: 15px;
            position: sticky; top: 0; z-index: 99;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .search-bar {
            display: flex; gap: 10px; margin-bottom: 10px;
        }
        .search-input {
            flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; background: #f9f9f9;
        }
        .filters-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
        }
        .filter-select {
            padding: 8px 12px; border-radius: 20px; border: 1px solid #ddd; 
            background: white; font-size: 13px; color: #555; white-space: nowrap;
        }
        .filter-select:focus { border-color: #2d8eff; outline: none; }

        /* LOAD MORE BUTTON */
        #load-more-container { text-align: center; margin: 30px 0 50px; display: none; }
        #load-more-btn {
            background: #333; color: white; border: none; padding: 12px 30px;
            border-radius: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s;
        }
        #load-more-btn:active { transform: scale(0.95); }

        /* 🌙 DARK MODE FIXES */
        body.dark-mode .filter-container {
            background: #1e1e1e !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        body.dark-mode .search-input {
            background: #333 !important;
            border-color: #444 !important;
            color: white !important;
        }
        body.dark-mode .filter-select {
            background: #333 !important;
            border-color: #444 !important;
            color: #ccc !important;
        }
        body.dark-mode #result-count {
            color: #aaa !important;
        }
        body.dark-mode #load-more-btn {
            background: #444;
        }
    </style>
</head>
<body>

    <script>
        // Apply theme immediately to prevent white flash
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>

    <div class="app-container">
        
        <div class="header">
            <a href="../" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <span style="font-weight:bold;">All Items</span>
            <div style="width:30px;"></div>
        </div>

        <div class="filter-container">
            <div class="search-bar">
                <input type="text" id="item-search" class="search-input" placeholder="Search items...">
            </div>
            
            <div class="filters-row">
                <select id="filter-price" class="filter-select">
                    <option value="all">Any Price</option>
                    <option value="under-5k">Under ₦5,000</option>
                    <option value="5k-20k">₦5k - ₦20k</option>
                    <option value="20k-50k">₦20k - ₦50k</option>
                    <option value="above-50k">Above ₦50k</option>
                </select>

                <select id="filter-condition" class="filter-select">
                    <option value="all">Any Condition</option>
                    <option value="New">New</option>
                    <option value="Used">Used</option>
                </select>

                <select id="filter-sort" class="filter-select">
                    <option value="newest">Newest First</option>
                    <option value="low-high">Price: Low to High</option>
                    <option value="high-low">Price: High to Low</option>
                </select>
            </div>
            <div id="result-count" style="font-size:11px; color:#888; margin-top:5px; text-align:center;">Loading items...</div>
        </div>

        <div class="trending-grid" id="all-items-container" style="padding-top: 10px;">
        </div>

        <div id="load-more-container">
            <button id="load-more-btn">Load More</button>
        </div>

    </div>

    <div id="login-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:15px; text-align:center; width:80%;">
            <h3>Sign In Required</h3>
            <p>Please login to save items.</p>
            <a href="../login.html" class="chat-btn" style="display:inline-block; margin-top:10px;">Login Now</a>
            <button onclick="document.getElementById('login-modal').style.display='none'" style="margin-top:10px; background:none; border:none; color:#777;">Close</button>
        </div>
    </div>

    <script src="../asset/script.js"></script>

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    // ADDED 'documentId' to imports 👇
    import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, query, orderBy, limit, startAfter, documentId } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
        authDomain: "afit-market-auth.firebaseapp.com",
        projectId: "afit-market-auth",
        storageBucket: "afit-market-auth.firebasestorage.app",
        messagingSenderId: "894920886640",
        appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let savedItemIds = new Set();
    
    // --- DATA LISTS ---
    let sheetList = [];      // Stores all Google Sheet items (Free)
    let firestoreList = [];  // Stores currently loaded Firestore items (Paid)
    let lastVisibleDoc = null; // Tracks pagination
    
    // --- CONFIG UPDATE ---
    const INITIAL_LOAD = 50; // Load 50 Random first
    const LOAD_STEP = 10;    // Load 10 Random after
    
    let isSearching = false;

    const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4";
    const apiRoot = `https://opensheet.elk.sh/${sheetID}`;
    const ADMIN_PHONE = "2348144516127"; 

    // --- XSS PROTECTION ---
    function escapeHTML(str) {
        if (!str) return "";
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            try {
                const querySnapshot = await getDocs(collection(db, "users", user.uid, "saved_items"));
                savedItemIds.clear();
                querySnapshot.forEach((doc) => { savedItemIds.add(doc.id); });
                updateHeartIcons(); 
            } catch (e) { console.error("Error loading wishlist:", e); }
        }
    });

    document.addEventListener("DOMContentLoaded", async () => {
        // Setup Search & Load More
        document.getElementById('load-more-btn').addEventListener('click', loadMoreFirestore);
        document.getElementById('item-search').addEventListener('input', handleSearch);

        // 1. Fetch Google Sheet Data (FREE - Load ALL)
        try {
            const vendorRes = await fetch(`${apiRoot}/Vendors`);
            const vendors = await vendorRes.json();
            const phoneBook = {};
            vendors.forEach(v => {
                const vID = v.vendor_id || v.Vendor_ID;
                const vPhone = v.whatsapp || v.Whatsapp;
                if(vID) phoneBook[vID] = String(vPhone).replace(/[^0-9]/g, '');
            });

            const sheetRes = await fetch(`${apiRoot}/Products`);
            const sheetRaw = await sheetRes.json();
            
            // Process Sheet Items
            sheetList = sheetRaw.map(p => ({
                ...p,
                numericPrice: parseInt(String(p.price||p.Price).replace(/[^0-9]/g, '')) || 0,
                phone: phoneBook[p.vendor_id || p.Vendor_ID] || ADMIN_PHONE
            }));

            // 2. Load Initial Firestore Batch
            await loadMoreFirestore();

        } catch (err) { console.error(err); }
    });

    // --- ECONOMICAL RANDOM FETCH ---
    async function loadMoreFirestore() {
        const loadBtn = document.getElementById('load-more-btn');
        loadBtn.innerText = "Loading...";
        
        try {
            let q;
            const productsRef = collection(db, "products");
            
            // Determine Batch Size
            const batchSize = (!lastVisibleDoc) ? INITIAL_LOAD : LOAD_STEP;

            // RANDOM SORT LOGIC:
            // We order by 'documentId()'. Since IDs are random strings (e.g. '7Ab2...', 'z9X...'),
            // sorting by them shuffles the Date order efficiently without extra cost.
            if (lastVisibleDoc) {
                q = query(productsRef, orderBy(documentId()), startAfter(lastVisibleDoc), limit(batchSize));
            } else {
                q = query(productsRef, orderBy(documentId()), limit(batchSize));
            }

            if(isSearching) { loadBtn.style.display = 'none'; return; }

            const snapshot = await getDocs(q);
            
            if (snapshot.empty) {
                loadBtn.style.display = 'none'; // No more items
            } else {
                lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
                
                const newItems = snapshot.docs.map(doc => ({ 
                    id: doc.id, 
                    ...doc.data(),
                    numericPrice: parseInt(String(doc.data().price).replace(/[^0-9]/g, '')) || 0,
                    phone: ADMIN_PHONE 
                }));

                firestoreList = [...firestoreList, ...newItems];
                renderCombinedGrid();
                loadBtn.innerText = "Load More";
            }
        } catch (e) { console.error("Firestore Error:", e); }
    }

    // --- HYBRID SEARCH ---
    async function handleSearch(e) {
        const term = e.target.value.toLowerCase().trim();
        const loadBtn = document.getElementById('load-more-btn');

        if (!term) {
            isSearching = false;
            loadBtn.style.display = 'block';
            renderCombinedGrid();
            return;
        }

        isSearching = true;
        loadBtn.style.display = 'none';

        // 1. Search Google Sheet (Local - Free)
        const sheetMatches = sheetList.filter(p => (p.name || p.Name).toLowerCase().includes(term));

        // 2. Search Loaded Firestore Items (Local - Free)
        const firestoreLocalMatches = firestoreList.filter(p => (p.name).toLowerCase().includes(term));

        // Combine and Render
        const totalMatches = [...sheetMatches, ...firestoreLocalMatches];
        renderCustomGrid(totalMatches);
    }

    function renderCombinedGrid() {
        // Randomize the Sheet items too so they don't always appear at the top
        // (Optional, but makes it feel more integrated)
        const allItems = [...sheetList, ...firestoreList];
        renderCustomGrid(allItems);
    }

    function renderCustomGrid(items) {
        const container = document.getElementById('all-items-container');
        document.getElementById('result-count').innerText = `${items.length} items showing`;
        container.innerHTML = "";

        if(items.length === 0) {
            container.innerHTML = "<p style='text-align:center; width:100%; color:#888; margin-top:20px;'>No items found.</p>";
            return;
        }

        items.forEach(p => {
            const pName = p.name || p.Name;
            const pPrice = p.price || p.Price;
            const pVendor = p.vendor_id || p.Vendor_ID;
            const pImage = p.image || p.Image;
            const pCond = p.condition || "Used";
            const pStatus = p.status || p.Status || "Active";
            const pID = p.id || (pVendor + "-" + pName).replace(/\s+/g, '-').toLowerCase();

            const img = pImage.startsWith('http') ? pImage : `../img/${pImage}`;
            const isSaved = savedItemIds.has(pID);
            const heartClass = isSaved ? 'fas' : 'far';
            const heartColor = isSaved ? '#ff4757' : '#777';

            const isSold = pStatus === "Sold";
            const opacity = isSold ? 'opacity:0.6;' : '';
            const soldBadge = isSold ? '<span style="background:red; color:white; font-size:9px; padding:2px 5px; position:absolute; top:10px; left:10px; border-radius:4px; z-index:10;">SOLD</span>' : '';
            const condBadge = (!isSold && pCond === "New") ? `<span style="background:#00b894; color:white; font-size:9px; padding:2px 5px; position:absolute; top:10px; left:10px; z-index:10;">NEW</span>` : '';

            // Safe Strings
            const safeNameJS = pName.replace(/'/g, "\\'").replace(/"/g, "&quot;");
            const safeNameHTML = escapeHTML(pName);
            const safePrice = escapeHTML(pPrice);

            const waMsg = encodeURIComponent(`Hi, I saw "${pName}" on AFIT Market. Is it available?`);
            const waLink = `https://wa.me/${p.phone}?text=${waMsg}`;
            const btnHref = isSold ? "#" : waLink;
            const btnText = isSold ? "Sold" : "Get Item";
            const btnStyle = isSold ? "background:#777; pointer-events:none;" : "";

            container.innerHTML += `
            <div class="ad-card" style="position:relative; ${opacity}">
                ${soldBadge} ${condBadge}
                <button onclick="toggleSave('${pID}', '${safeNameJS}', '${safePrice}', '${pImage}', '${pVendor}')" 
                        class="save-btn" id="save-${pID}"
                        style="position:absolute; top:10px; right:10px; background:white; border:none; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2); z-index:10;">
                    <i class="${heartClass} fa-heart" style="color:${heartColor}; font-size:16px;"></i>
                </button>
                <img class="ad-img" src="${img}" onerror="this.src='../img/logo-blue.png'">
                <div class="ad-info">
                    <div class="ad-price">${safePrice}</div>
                    <div class="ad-title">${safeNameHTML}</div>
                    <div class="ad-location" style="font-size:11px; color:#888;">${pCond} • ${pVendor}</div>
                    <a href="${btnHref}" target="_blank" class="chat-btn" style="${btnStyle}">${btnText}</a>
                </div>
            </div>`;
        });
    }

    window.toggleSave = async function(id, name, price, image, vendor) {
        const user = auth.currentUser;
        if (!user) { document.getElementById('login-modal').style.display = 'flex'; return; }
        const userRef = doc(db, "users", user.uid, "saved_items", id);
        if (savedItemIds.has(id)) {
            savedItemIds.delete(id); await deleteDoc(userRef);
        } else {
            savedItemIds.add(id);
            await setDoc(userRef, { product_id: id, name: name, price: price, image: image, vendor: vendor, saved_at: new Date() });
        }
        updateHeartIcons();
    };

    function updateHeartIcons() {
        document.querySelectorAll('.save-btn').forEach(btn => {
            const id = btn.id.replace('save-', '');
            const icon = btn.querySelector('i');
            if (savedItemIds.has(id)) {
                icon.classList.replace('far', 'fas'); icon.style.color = '#ff4757';
            } else {
                icon.classList.replace('fas', 'far'); icon.style.color = '#777';
            }
        });
    }
</script>
</body>
</html>
