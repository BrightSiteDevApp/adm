<html lang="en">
<head>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>All Items - AFIT Market</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../asset/style.css">
  <link rel="icon" href="../img/app-logo.png">
</head>
<body>

  <div class="app-container">
    <div class="header">
      <a href="../" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <span style="font-weight:bold;">All Available Items</span>
    </div>

    <div class="cat-search-container">
        <div class="search-wrapper cat-search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="item-search" class="search-input" placeholder="Search for anything...">
        </div>
    </div>

    <div class="trending-grid" id="all-items-container" style="padding: 15px;">
        
        <div class="skeleton-card">
            <div class="skeleton sk-img-rect"></div>
            <div class="skeleton sk-text-short"></div>
            <div class="skeleton sk-text-long"></div>
            <div class="skeleton sk-btn"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton sk-img-rect"></div>
            <div class="skeleton sk-text-short"></div>
            <div class="skeleton sk-text-long"></div>
            <div class="skeleton sk-btn"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton sk-img-rect"></div>
            <div class="skeleton sk-text-short"></div>
            <div class="skeleton sk-text-long"></div>
            <div class="skeleton sk-btn"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton sk-img-rect"></div>
            <div class="skeleton sk-text-short"></div>
            <div class="skeleton sk-text-long"></div>
            <div class="skeleton sk-btn"></div>
        </div>

    </div>

    <footer class="site-footer">
        <p style="margin-top:10px; color:#777;">&copy; 2026 BrightSiteDev</p>
    </footer>
  </div>

  <script src="../asset/script.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, query } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ✅ YOUR FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
        authDomain: "afit-market-auth.firebaseapp.com",
        projectId: "afit-market-auth",
        storageBucket: "afit-market-auth.firebasestorage.app",
        messagingSenderId: "894920886640",
        appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Global Variables
    let savedItemIds = new Set();
    const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4";
    const apiRoot = `https://opensheet.elk.sh/${sheetID}`;
    const ADMIN_PHONE = "2348144516127"; 

    // -- AUTH CHECK --
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            try {
                const querySnapshot = await getDocs(collection(db, "users", user.uid, "saved_items"));
                savedItemIds.clear();
                querySnapshot.forEach((doc) => {
                    savedItemIds.add(doc.id);
                });
                updateHeartIcons(); 
            } catch (e) {
                console.error("Error loading wishlist:", e);
            }
        } else {
            savedItemIds.clear();
            updateHeartIcons();
        }
    });

    // -- SAVE ITEM FUNCTION --
    window.toggleSave = async function(id, name, price, image, vendor) {
        const user = auth.currentUser;
        if (!user) {
            if(confirm("You need to sign in to save items. Go to login page?")) {
                window.location.href = "../login.html"; // Note: ../ because we are inside items folder
            }
            return;
        }

        const btn = document.getElementById(`save-${id}`);
        const icon = btn.querySelector('i');
        const userRef = doc(db, "users", user.uid, "saved_items", id);

        if (savedItemIds.has(id)) {
            // REMOVE
            icon.classList.replace('fas', 'far');
            icon.style.color = '#777';
            savedItemIds.delete(id);
            await deleteDoc(userRef);
        } else {
            // SAVE
            icon.classList.replace('far', 'fas');
            icon.style.color = '#ff4757';
            savedItemIds.add(id);
            await setDoc(userRef, {
                product_id: id,
                name: name,
                price: price,
                image: image,
                vendor: vendor,
                saved_at: new Date()
            });
        }
    };

    function updateHeartIcons() {
        document.querySelectorAll('.save-btn').forEach(btn => {
            const id = btn.id.replace('save-', '');
            const icon = btn.querySelector('i');
            if (savedItemIds.has(id)) {
                icon.classList.remove('far');
                icon.classList.add('fas');
                icon.style.color = '#ff4757';
            } else {
                icon.classList.remove('fas');
                icon.classList.add('far');
                icon.style.color = '#777';
            }
        });
    }

    // -- LOAD ITEMS LOGIC --
    function shuffle(array) { return array.sort(() => 0.5 - Math.random()); }

    // ✅ NEW: Helper to get Dashboard items from Firestore
    async function loadFirestoreProducts() {
        try {
            const q = query(collection(db, "products")); 
            const snapshot = await getDocs(q);
            let items = [];
            snapshot.forEach(doc => {
                const d = doc.data();
                items.push({
                    name: d.name,
                    price: d.price,
                    image: d.image,
                    vendor_id: d.vendor_id,
                    description: d.description,
                    status: d.status
                });
            });
            return items;
        } catch(e) {
            console.error("Firestore Load Error:", e);
            return [];
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        // Fetch Vendors first
        fetch(`${apiRoot}/Vendors`)
        .then(res => res.json())
        .then(vendors => {
            const phoneBook = {};
            vendors.forEach(v => {
                const vID = v.vendor_id || v.Vendor_ID;
                const vPhone = v.whatsapp || v.Whatsapp;
                if(vID) phoneBook[vID] = String(vPhone).replace(/[^0-9]/g, '');
            });

            // Fetch Products (Sheets + Firestore)
            return fetch(`${apiRoot}/Products`)
                .then(res => res.json())
                .then(async (sheetProducts) => {
                    const firestoreProducts = await loadFirestoreProducts();
                    const allProducts = [...sheetProducts, ...firestoreProducts];
                    return { products: allProducts, phoneBook };
                });
        })
        .then(({ products, phoneBook }) => {
            const container = document.getElementById('all-items-container');
            container.innerHTML = ""; 

            const available = products.filter(p => (p.status || p.Status) !== "Sold");
            const shuffled = shuffle(available);

            if(shuffled.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding:20px; color:#777;'>No items found.</p>";
                return;
            }

            shuffled.forEach(p => {
                const pName = p.name || p.Name;
                const pPrice = p.price || p.Price;
                const pDesc = p.description || p.Description || ""; 
                const pVendor = p.vendor_id || p.Vendor_ID;
                const pImage = p.image || p.Image;

                const img = pImage.startsWith('http') ? pImage : `../img/${pImage}`;
                const vendorPhone = phoneBook[pVendor] || ADMIN_PHONE;
                const waLink = `https://wa.me/${vendorPhone}?text=${encodeURIComponent(`Hi, I saw "${pName}" on AFIT Market. Is it available?`)}`;

                // Create ID
                const pID = (pVendor + "-" + pName).replace(/\s+/g, '-').toLowerCase();
                const isSaved = savedItemIds.has(pID);
                const heartClass = isSaved ? 'fas' : 'far';
                const heartColor = isSaved ? '#ff4757' : '#777';

                container.innerHTML += `
                <div class="ad-card" style="position:relative;">
                    
                    <button onclick="toggleSave('${pID}', '${pName}', '${pPrice}', '${pImage}', '${pVendor}')" 
                            class="save-btn" 
                            id="save-${pID}"
                            style="position:absolute; top:10px; right:10px; background:white; border:none; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2); z-index:10;">
                        <i class="${heartClass} fa-heart" style="color:${heartColor}; font-size:16px;"></i>
                    </button>

                    <img class="ad-img" src="${img}" alt="${pName}" onerror="this.src='../img/logo-blue.png'">
                    <div class="ad-info">
                        <div class="ad-price">${pPrice}</div>
                        <div class="ad-title">${pName}</div>
                        <div class="ad-desc">${pDesc}</div>
                        <div class="ad-location">Vendor: ${pVendor}</div>
                        <a href="${waLink}" class="chat-btn" target="_blank">Get Item</a>
                    </div>
                </div>`;
            });

            // Search Logic
            const searchInput = document.getElementById('item-search');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    document.querySelectorAll('.ad-card').forEach(card => {
                        const title = card.querySelector('.ad-title').innerText.toLowerCase();
                        card.style.display = title.includes(query) ? "" : "none";
                    });
                });
            }
        })
        .catch(err => console.error(err));
    });
</script>
</body>
</html>
