<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Items - AFIT Market</title>
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../img/app-logo.png">
    
    <style>
        /* Filter Bar Styles */
        .filter-container {
            background: white;
            padding: 15px;
            position: sticky; top: 0; z-index: 99;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .search-bar {
            display: flex; gap: 10px; margin-bottom: 10px;
        }
        .search-input {
            flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; background: #f9f9f9;
        }
        .filters-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
        }
        .filter-select {
            padding: 8px 12px; border-radius: 20px; border: 1px solid #ddd; 
            background: white; font-size: 13px; color: #555; white-space: nowrap;
        }
        .filter-select:focus { border-color: #2d8eff; outline: none; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header">
            <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <span style="font-weight:bold;">All Items</span>
            <div style="width:30px;"></div>
        </div>

        <div class="filter-container">
            <div class="search-bar">
                <input type="text" id="item-search" class="search-input" placeholder="Search items...">
            </div>
            
            <div class="filters-row">
                <select id="filter-price" class="filter-select">
                    <option value="all">Any Price</option>
                    <option value="under-5k">Under ₦5,000</option>
                    <option value="5k-20k">₦5k - ₦20k</option>
                    <option value="20k-50k">₦20k - ₦50k</option>
                    <option value="above-50k">Above ₦50k</option>
                </select>

                <select id="filter-condition" class="filter-select">
                    <option value="all">Any Condition</option>
                    <option value="New">New</option>
                    <option value="Used">Used</option>
                </select>

                <select id="filter-sort" class="filter-select">
                    <option value="newest">Newest First</option>
                    <option value="low-high">Price: Low to High</option>
                    <option value="high-low">Price: High to Low</option>
                </select>
            </div>
            <div id="result-count" style="font-size:11px; color:#888; margin-top:5px; text-align:center;">Loading items...</div>
        </div>

        <div class="trending-grid" id="all-items-container" style="padding-top: 10px;">
            </div>

    </div>

    <div id="login-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:15px; text-align:center; width:80%;">
            <h3>Sign In Required</h3>
            <p>Please login to save items.</p>
            <a href="../login.html" class="chat-btn" style="display:inline-block; margin-top:10px;">Login Now</a>
            <button onclick="document.getElementById('login-modal').style.display='none'" style="margin-top:10px; background:none; border:none; color:#777;">Close</button>
        </div>
    </div>

    <script src="../asset/script.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, query } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
            authDomain: "afit-market-auth.firebaseapp.com",
            projectId: "afit-market-auth",
            storageBucket: "afit-market-auth.firebasestorage.app",
            messagingSenderId: "894920886640",
            appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let savedItemIds = new Set();
        let masterList = []; // Stores ALL items locally for fast filtering
        const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4";
        const apiRoot = `https://opensheet.elk.sh/${sheetID}`;
        const ADMIN_PHONE = "2348144516127"; 

        // -- AUTH CHECK --
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const querySnapshot = await getDocs(collection(db, "users", user.uid, "saved_items"));
                    savedItemIds.clear();
                    querySnapshot.forEach((doc) => { savedItemIds.add(doc.id); });
                    updateHeartIcons(); 
                } catch (e) { console.error("Error loading wishlist:", e); }
            }
        });

        // -- DATA LOADING --
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // 1. Get Blocklist
                const suspendedSnap = await getDocs(collection(db, "vendor_status"));
                const suspendedVendors = new Set();
                suspendedSnap.forEach(doc => { if(doc.data().status === "suspended") suspendedVendors.add(doc.id); });

                // 2. Fetch Vendors (for Phone Numbers)
                const vendorRes = await fetch(`${apiRoot}/Vendors`);
                const vendors = await vendorRes.json();
                const phoneBook = {};
                vendors.forEach(v => {
                    const vID = v.vendor_id || v.Vendor_ID;
                    const vPhone = v.whatsapp || v.Whatsapp;
                    if(vID) phoneBook[vID] = String(vPhone).replace(/[^0-9]/g, '');
                });

                // 3. Fetch Products (Sheets + Firestore)
                const [sheetRes, firestoreItems] = await Promise.all([
                    fetch(`${apiRoot}/Products`).then(res => res.json()),
                    loadFirestoreProducts()
                ]);

                // 4. Combine & Normalize
                const combined = [...sheetRes, ...firestoreItems];
                
                // 5. Create Master List (Add numeric price for sorting)
                masterList = combined
                    .filter(p => (p.status || p.Status) !== "Sold" && !suspendedVendors.has(p.vendor_id || p.Vendor_ID))
                    .map(p => {
                        const rawPrice = String(p.price || p.Price);
                        // Convert "₦15,000" -> 15000
                        const numPrice = parseInt(rawPrice.replace(/[^0-9]/g, '')) || 0;
                        return { ...p, numericPrice: numPrice, phone: phoneBook[p.vendor_id || p.Vendor_ID] || ADMIN_PHONE };
                    });

                // Initial Render
                applyFilters();

                // Setup Event Listeners
                document.getElementById('item-search').addEventListener('input', applyFilters);
                document.getElementById('filter-price').addEventListener('change', applyFilters);
                document.getElementById('filter-condition').addEventListener('change', applyFilters);
                document.getElementById('filter-sort').addEventListener('change', applyFilters);

            } catch (err) { console.error(err); }
        });

        // -- FILTERING LOGIC --
        function applyFilters() {
            const searchTerm = document.getElementById('item-search').value.toLowerCase();
            const priceFilter = document.getElementById('filter-price').value;
            const condFilter = document.getElementById('filter-condition').value;
            const sortFilter = document.getElementById('filter-sort').value;

            let filtered = masterList.filter(item => {
                const name = (item.name || item.Name).toLowerCase();
                const condition = String(item.condition || "Used"); // Default to Used if missing

                // 1. Search Text
                if (searchTerm && !name.includes(searchTerm)) return false;

                // 2. Condition
                if (condFilter !== 'all' && condition !== condFilter) return false;

                // 3. Price
                const p = item.numericPrice;
                if (priceFilter === 'under-5k' && p > 5000) return false;
                if (priceFilter === '5k-20k' && (p < 5000 || p > 20000)) return false;
                if (priceFilter === '20k-50k' && (p < 20000 || p > 50000)) return false;
                if (priceFilter === 'above-50k' && p < 50000) return false;

                return true;
            });

            // 4. Sort
            if (sortFilter === 'low-high') filtered.sort((a, b) => a.numericPrice - b.numericPrice);
            if (sortFilter === 'high-low') filtered.sort((a, b) => b.numericPrice - a.numericPrice);
            // Default "newest" relies on array order (assuming fetched newest last)
            if (sortFilter === 'newest') filtered.reverse(); // If your data comes oldest first

            renderGrid(filtered);
        }

        function renderGrid(items) {
            const container = document.getElementById('all-items-container');
            const countLabel = document.getElementById('result-count');
            
            container.innerHTML = "";
            countLabel.innerText = `${items.length} items found`;

            if(items.length === 0) {
                container.innerHTML = "<p style='width:100%; text-align:center; padding:20px; color:#777;'>No items match your filters.</p>";
                return;
            }

            items.forEach(p => {
                const pName = p.name || p.Name;
                const pPrice = p.price || p.Price;
                const pDesc = p.description || p.Description || ""; 
                const pVendor = p.vendor_id || p.Vendor_ID;
                const pImage = p.image || p.Image;
                const pCond = p.condition || "Used";
                
                const img = pImage.startsWith('http') ? pImage : `../img/${pImage}`;
                const waLink = `https://wa.me/${p.phone}?text=${encodeURIComponent(`Hi, I saw "${pName}" on AFIT Market. Is it available?`)}`;
                
                const pID = (pVendor + "-" + pName).replace(/\s+/g, '-').toLowerCase();
                const isSaved = savedItemIds.has(pID);
                const heartClass = isSaved ? 'fas' : 'far';
                const heartColor = isSaved ? '#ff4757' : '#777';

                // Badge for Condition
                const condBadge = pCond === "New" ? 
                    `<span style="background:#00b894; color:white; font-size:9px; padding:2px 5px; border-radius:4px; position:absolute; top:10px; left:10px; z-index:10;">NEW</span>` : '';

                container.innerHTML += `
                <div class="ad-card" style="position:relative;">
                    ${condBadge}
                    <button onclick="toggleSave('${pID}', '${pName}', '${pPrice}', '${pImage}', '${pVendor}')" 
                            class="save-btn" id="save-${pID}"
                            style="position:absolute; top:10px; right:10px; background:white; border:none; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2); z-index:10;">
                        <i class="${heartClass} fa-heart" style="color:${heartColor}; font-size:16px;"></i>
                    </button>
                    <img class="ad-img" src="${img}" alt="${pName}" onerror="this.src='../img/logo-blue.png'">
                    <div class="ad-info">
                        <div class="ad-price">${pPrice}</div>
                        <div class="ad-title">${pName}</div>
                        <div class="ad-location" style="font-size:11px; color:#888;">${pCond} • ${pVendor}</div>
                        <a href="${waLink}" class="chat-btn" target="_blank">Get Item</a>
                    </div>
                </div>`;
            });
        }

        async function loadFirestoreProducts() {
            try {
                const q = query(collection(db, "products")); 
                const snapshot = await getDocs(q);
                let items = [];
                snapshot.forEach(doc => {
                    const d = doc.data();
                    items.push({
                        name: d.name, price: d.price, image: d.image, vendor_id: d.vendor_id,
                        description: d.description, status: d.status, condition: d.condition // ✅ Load condition
                    });
                });
                return items;
            } catch(e) { return []; }
        }

        window.toggleSave = async function(id, name, price, image, vendor) {
            const user = auth.currentUser;
            if (!user) { document.getElementById('login-modal').style.display = 'flex'; return; }
            const btn = document.getElementById(`save-${id}`);
            const icon = btn.querySelector('i');
            const userRef = doc(db, "users", user.uid, "saved_items", id);

            if (savedItemIds.has(id)) {
                icon.classList.replace('fas', 'far'); icon.style.color = '#777';
                savedItemIds.delete(id); await deleteDoc(userRef);
            } else {
                icon.classList.replace('far', 'fas'); icon.style.color = '#ff4757';
                savedItemIds.add(id);
                await setDoc(userRef, { product_id: id, name: name, price: price, image: image, vendor: vendor, saved_at: new Date() });
            }
        };

        function updateHeartIcons() {
            document.querySelectorAll('.save-btn').forEach(btn => {
                const id = btn.id.replace('save-', '');
                const icon = btn.querySelector('i');
                if (savedItemIds.has(id)) {
                    icon.classList.remove('far'); icon.classList.add('fas'); icon.style.color = '#ff4757';
                } else {
                    icon.classList.remove('fas'); icon.classList.add('far'); icon.style.color = '#777';
                }
            });
        }
    </script>
</body>
</html>
