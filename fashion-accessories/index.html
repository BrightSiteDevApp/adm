<script>
    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById('vendor-list-container');
        const searchInput = document.getElementById('vendor-search');
        
        // 1. SHUFFLE LOGIC
        if (container) {
            const items = Array.from(container.children);
            
            // Random Shuffle
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            
            // Re-append shuffled items
            container.innerHTML = "";
            items.forEach(item => container.appendChild(item));
        }

        // 2. SEARCH LOGIC
        if (searchInput && container) {
            
            // A. Real-time Filter
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const items = container.querySelectorAll('.cat-item');

                items.forEach(item => {
                    const name = item.querySelector('.cat-name').innerText.toLowerCase();
                    const id = item.querySelector('.vendor-list-id').innerText.toLowerCase();

                    // Search by Name OR ID
                    if (name.includes(query) || id.includes(query)) {
                        item.style.display = "flex"; // Show
                    } else {
                        item.style.display = "none"; // Hide
                    }
                });
            });

            // B. Close Keyboard on "Enter"
            searchInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    searchInput.blur(); 
                }
            });
        }
    });
</script>
