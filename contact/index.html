    <style>
        /* 🚀 EXACT AFIT BLUE VARIABLES */
        :root {
            --brand-color: #2d8eff; /* AFIT Blue */
            --brand-hover: #1a73e8;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body, html { background: #f8fafc; margin: 0; padding: 0; font-family: 'Poppins', sans-serif;}
        .app-container { min-height: 100vh; position: relative; padding-bottom: 40px;}

        /* 🚀 PREMIUM HERO HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), #1e3a8a);
            padding: 20px 20px 60px 20px;
            border-radius: 0 0 30px 30px;
            color: white;
            position: relative;
        }
        .header-top-flex { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
        .back-btn { color: white; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; backdrop-filter: blur(5px); transition: 0.2s;}
        .back-btn:active { transform: scale(0.9); }
        .page-title { font-size: 22px; font-weight: 900; margin: 0; }
        .page-subtitle { font-size: 13px; color: #bae6fd; margin-top: 5px; margin-left: 55px; font-weight: 500; }

        /* 🚀 FLOATING CONTACT CARD */
        .contact-card {
            background: white; border-radius: 24px; padding: 30px 20px 25px;
            margin: -35px 20px 20px; position: relative; z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid #f1f5f9;
        }

        .contact-intro { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; text-align: center; font-weight: 500;}

        /* 🚀 UPGRADED FORM INPUTS */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 800; font-size: 12px; margin-bottom: 8px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px;}
        
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 15px; transition: 0.2s; }
        
        .form-input { 
            width: 100%; padding: 15px 15px 15px 45px; border: 2px solid #e2e8f0; 
            border-radius: 14px; background: #f8fafc; font-size: 14px; color: var(--text-main);
            outline: none; transition: 0.2s; box-sizing: border-box; font-family: inherit; font-weight: 500;
        }
        textarea.form-input { padding-left: 15px; resize: vertical; min-height: 110px; }
        
        .form-input:focus { border-color: var(--brand-color); background: white; box-shadow: 0 4px 15px rgba(45, 142, 255, 0.1); }
        .input-wrapper:focus-within .input-icon { color: var(--brand-color); }
        
        .submit-btn { 
            width: 100%; padding: 16px; background: var(--brand-color); color: white; border: none; 
            border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; 
            box-shadow: 0 6px 20px rgba(45, 142, 255, 0.3); display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .submit-btn:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(45, 142, 255, 0.2); }
        
        /* 🚀 OR DIVIDER */
        .divider { display: flex; align-items: center; text-align: center; margin: 30px 0; color: #94a3b8; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 2px solid #f1f5f9; }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        /* 🚀 APP-LIKE WHATSAPP TILES */
        .whatsapp-row { display: flex; gap: 15px; }
        .wa-btn { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; 
            background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; padding: 18px 10px; 
            border-radius: 16px; font-weight: 800; font-size: 13px; text-decoration: none; 
            transition: 0.2s; text-align: center; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.1);
        }
        .wa-btn i { font-size: 26px; }
        .wa-btn span { font-size: 11px; font-weight: 600; opacity: 0.8; }
        .wa-btn:active { transform: scale(0.96); background: #dcfce7; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES                        */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; }
        
        body.dark-mode .hero-header { background: linear-gradient(135deg, #1e3a8a, #0f172a) !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;}
        body.dark-mode .back-btn { background: rgba(255,255,255,0.1) !important; }
        body.dark-mode .page-title { color: #f1f5f9 !important; }

        body.dark-mode .contact-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: none !important;}
        body.dark-mode .contact-intro { color: #94a3b8 !important; }
        
        body.dark-mode .form-group label { color: #f1f5f9 !important; }
        body.dark-mode .form-input { background: #0f172a !important; border-color: #334155 !important; color: #f1f5f9 !important; }
        body.dark-mode .form-input:focus { border-color: var(--brand-color) !important; background: #1e293b !important;}
        body.dark-mode .input-icon { color: #64748b !important; }
        
        body.dark-mode .divider { color: #64748b !important; }
        body.dark-mode .divider::before, body.dark-mode .divider::after { border-bottom-color: #334155 !important; }

        body.dark-mode .wa-btn { background: rgba(22, 163, 74, 0.1) !important; border-color: rgba(22, 163, 74, 0.3) !important; color: #4ade80 !important; box-shadow: none !important;}
        body.dark-mode .wa-btn:active { background: rgba(22, 163, 74, 0.2) !important; }
    </style>

<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        
        <!-- 🚀 NEW HERO HEADER -->
        <div class="hero-header">
            <div class="header-top-flex">
                <button onclick="window.history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h1 class="page-title">Contact Us</h1>
            </div>
            <div class="page-subtitle">We're here to help you 24/7</div>
        </div>

        <div class="content-area">
            <!-- 🚀 FLOATING CONTACT CARD -->
            <div class="contact-card">
                <p class="contact-intro">Have a question, feedback, or need to report an issue with a vendor? Send us a message below.</p>

                <form action="https://formsubmit.co/afitdgm@gmail.com" method="POST">
                    <input type="hidden" name="_subject" value="New Support Message from ADM">
                    <input type="hidden" name="_captcha" value="false">
                    <!-- 🚀 FIX: Correct redirect URL -->
                    <input type="hidden" name="_next" value="https://afitdgm.store/contact/index.html"> 

                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" name="name" class="form-input" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone-alt input-icon"></i>
                            <input type="tel" name="phone" class="form-input" placeholder="e.g. 08012345678" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <textarea name="message" class="form-input" placeholder="How can we help you today?" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i> Send Message</button>
                </form>
                
                <div class="divider">Or Connect Instantly</div>

                <!-- 🚀 APP-LIKE WHATSAPP TILES -->
                <div class="whatsapp-row">
                    <a href="https://wa.me/2349153375488" class="wa-btn">
                        <i class="fab fa-whatsapp"></i> 
                        Support Desk
                        <span>Get help now</span>
                    </a>
                    <a href="https://wa.me/2348144516127?text=I%20want%20to%20place%20an%20ad" class="wa-btn">
                        <i class="fas fa-bullhorn"></i> 
                        Ads / Promo
                        <span>Boost your shop</span>
                    </a>
                </div>
            </div>
        </div>

    </div>
