<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - AFIT Market</title>
    <link rel="stylesheet" href="asset/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/app-logo.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    
    <style>
        /* Dashboard Styles */
        .dash-header {
            background: linear-gradient(135deg, #2d8eff, #6c5ce7);
            color: white;
            padding: 25px 20px 40px;
            border-radius: 0 0 25px 25px;
            margin-bottom: -30px;
            box-shadow: 0 4px 15px rgba(45, 142, 255, 0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .stat-num { font-size: 24px; font-weight: bold; color: #333; }
        .stat-label { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }

        /* Floating Add Button */
        .fab-add {
            position: fixed; bottom: 25px; right: 25px;
            background: #2d8eff; color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; box-shadow: 0 4px 15px rgba(45, 142, 255, 0.5);
            cursor: pointer; z-index: 100; transition: transform 0.2s;
        }
        .fab-add:active { transform: scale(0.9); }

        /* Modal */
        .upload-modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.6);
            z-index: 2000; justify-content: center; align-items: flex-end;
        }
        .upload-content {
            background: white; width: 100%; max-width: 500px;
            border-radius: 25px 25px 0 0; padding: 30px 25px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 8px; }
        .form-input {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            border-radius: 10px; font-size: 14px; box-sizing: border-box; background: #f9f9f9;
        }

        /* ACTIONS BAR ON CARD */
        .card-actions {
            position: absolute; top: 10px; right: 10px; z-index: 10;
            display: flex; gap: 5px;
        }
        .action-btn {
            width: 30px; height: 30px; border-radius: 50%; border: none;
            color: white; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 12px;
        }
        .btn-del { background: rgba(255, 71, 87, 0.9); }
        .btn-sold { background: rgba(46, 204, 113, 0.9); } 
        .btn-sold.is-sold { background: rgba(50, 50, 50, 0.9); }
        .btn-edit { background: rgba(52, 152, 219, 0.9); } /* Blue Edit Button */

        /* LIMIT POPUP */
        .limit-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 3000; justify-content: center; align-items: center; padding: 20px;
        }
        .limit-box {
            background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 300px;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        /* Dark Mode */
        body.dark-mode .stat-card, body.dark-mode .upload-content, body.dark-mode .limit-box { background: #1e1e1e; color: white; }
        body.dark-mode .form-input { background: #333; border-color: #444; color: white; }
        body.dark-mode .stat-num { color: white; }
        body.dark-mode .dash-header { box-shadow: none; border-bottom: 1px solid #333; }
    </style>
</head>
<body data-page="dashboard">

    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>

    <div class="app-container">
        
        <div class="dash-header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <a href="index.html" style="color:white;"><i class="fas fa-arrow-left"></i> Home</a>
                <div id="vendor-badge" style="font-size:10px; background:rgba(255,255,255,0.25); padding:4px 10px; border-radius:15px; font-weight:bold;">
                    Checking...
                </div>
            </div>
            <h2 style="margin-top:20px; font-size:22px; margin-bottom: 5px;">Hi, <span id="dash-name">...</span></h2>
            <div style="font-size:12px; opacity:0.9; margin-top:5px; display:flex; align-items:center; gap:5px;">
                <i class="fas fa-crown" style="color:#ffd700;"></i> 
                Limit: <span id="limit-display">Checking...</span> items
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-num" id="item-count">0</div>
                <div class="stat-label">Used Slots</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="view-count">--</div>
                <div class="stat-label">Total Views</div>
            </div>
        </div>

        <div id="status-message" style="text-align:center; padding:30px; color:#777; font-size:14px;">
            <i class="fas fa-circle-notch fa-spin"></i> Verifying Vendor Access...
        </div>

        <div style="padding: 0 15px 80px;">
            <h4 style="margin-bottom:15px; font-size: 16px;">Active Inventory</h4>
            <div id="my-items-grid" class="trending-grid">
                </div>
        </div>

    </div>

    <div class="fab-add" id="add-btn" style="display:none;" onclick="openNewUpload()">
        <i class="fas fa-plus"></i>
    </div>

    <div id="upload-modal" class="upload-modal">
        <div class="upload-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3 style="margin:0;" id="modal-title">New Item</h3>
                <i class="fas fa-times" onclick="closeUploadModal()" style="font-size:20px; color:#777; cursor:pointer;"></i>
            </div>

            <div class="form-group">
                <label class="form-label">Item Name</label>
                <input type="text" id="p-name" class="form-input" placeholder="e.g. iPhone 12 UK Used">
            </div>

            <div class="form-group">
                <label class="form-label">Price (Just type the number, e.g. 15000)</label>
                <div style="position: relative;">
                    <span style="position: absolute; left: 15px; top: 12px; font-weight: bold; color: #555;">₦</span>
                    <input type="number" id="p-price" class="form-input" style="padding-left: 30px;" placeholder="15000">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Description (Optional)</label>
                <input type="text" id="p-desc" class="form-input" placeholder="Short description...">
            </div>


           <div class="form-group">
    <label class="form-label">Category</label>
    <select id="p-cat" class="form-input">
        <option value="Phones">Phones</option>
        <option value="Laptops">Laptops</option>
        <option value="Fashion">Fashion</option>
        <option value="Fashion Accessories">Fashion Accessories</option>
        <option value="Phone Accessories">Phone Accessories</option>
        <option value="Gadgets">Gadgets</option>
        <option value="Food">Food</option>
        <option value="Appliances">Appliances</option>
        <option value="Services">Services</option>
    </select>
</div>


            <div class="form-group">
                <label class="form-label">Condition</label>
                <select id="p-condition" class="form-input">
                    <option value="New">New</option>
                    <option value="Used" selected>Used</option>
                    <option value="Refurbished">Refurbished</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Photo <span id="photo-label" style="font-weight:normal; color:#2d8eff;"></span></label>
                <input type="file" id="p-file" class="form-input" accept="image/*">
            </div>

            <button id="btn-submit" class="chat-btn" style="width:100%; background:#2d8eff; height: 50px; font-size: 16px;">Post Item</button>
        </div>
    </div>

    <div id="limit-modal" class="limit-alert">
        <div class="limit-box">
            <i class="fas fa-lock" style="font-size:50px; color:#ff4757; margin-bottom:20px;"></i>
            <h3 style="margin:0; color:#333;">Limit Reached!</h3>
            <p style="color:#777; font-size:14px; margin: 10px 0 20px;">You have used all <b id="alert-limit"></b> slots.</p>
            <p style="font-size:12px; color:#555;">Upgrade your plan to post more items.</p>
            <a href="https://wa.me/2348144516127?text=Hi%20Admin,%20I%20want%20to%20upgrade%20my%20vendor%20plan." class="chat-btn" style="width:100%; display:block; margin-top:10px;">Contact Admin</a>
            <button onclick="closeLimitModal()" style="background:none; border:none; color:#999; margin-top:15px; cursor:pointer;">Close</button>
        </div>
    </div>

    <script src="asset/script.js"></script>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, query, getDoc } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA1eQbrJpH9OtDNDN7z9oTFTRSAE7vCFbg",
        authDomain: "afit-market-auth.firebaseapp.com",
        projectId: "afit-market-auth",
        storageBucket: "afit-market-auth.firebasestorage.app",
        messagingSenderId: "894920886640",
        appId: "1:894920886640:web:77d0a6b39bf89ff8f767b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let savedItemIds = new Set();
    const sheetID = "1SvVUbEnDgqgw2Z_M1ShQkzyFTsnnS6n8mTs7UMXVvF4";
    const apiRoot = `https://opensheet.elk.sh/${sheetID}`;
    const ADMIN_PHONE = "2348144516127"; 
    let allProducts = [];
    let allVendors = [];
    let globalPhoneBook = {}; 
    let suspendedVendors = new Set(); 

    setupMainSearch();
    loadAds(); 
    initData();
    loadAnnouncement(); 

    async function loadAnnouncement() {
        try {
            const docSnap = await getDoc(doc(db, "settings", "global_alert"));
            if(docSnap.exists() && docSnap.data().active) {
                const banner = document.getElementById('global-announcement');
                if(banner) {
                    document.getElementById('announce-text').innerText = docSnap.data().message;
                    banner.style.display = 'block';
                }
            }
        } catch(e) { console.error("Banner error:", e); }
    }

    onAuthStateChanged(auth, async (user) => {
        const headerBtn = document.getElementById('header-profile-btn');
        if (user) {
            headerBtn.innerHTML = `<img src="${user.photoURL}" class="header-profile-img" alt="Profile">`;
            try {
                const querySnapshot = await getDocs(collection(db, "users", user.uid, "saved_items"));
                savedItemIds.clear();
                querySnapshot.forEach((doc) => { savedItemIds.add(doc.id); });
                updateHeartIcons(); 
            } catch (e) { console.error("Error loading wishlist:", e); }
        } else {
            headerBtn.innerHTML = `<i class="far fa-user" style="padding: 8px;"></i>`;
            savedItemIds.clear();
            updateHeartIcons(); 
        }
    });

    document.getElementById('popup-google-btn').addEventListener('click', () => {
        signInWithPopup(auth, provider)
            .then((result) => {
                document.getElementById('login-modal').style.display = 'none';
                sessionStorage.setItem('loginPopupDismissed', 'true');
            }).catch((error) => { alert("Login failed: " + error.message); });
    });

    async function initData() {
        try {
            const suspendedSnap = await getDocs(collection(db, "vendor_status"));
            suspendedSnap.forEach(doc => { if (doc.data().status === "suspended") suspendedVendors.add(doc.id); });

            const vendorRes = await fetch(`${apiRoot}/Vendors`);
            const vendors = await vendorRes.json();
            allVendors = vendors.filter(v => !suspendedVendors.has(v.vendor_id || v.Vendor_ID));

            allVendors.forEach(v => {
                const vID = v.vendor_id || v.Vendor_ID;
                if(vID) globalPhoneBook[vID] = String(v.whatsapp || v.Whatsapp).replace(/[^0-9]/g, '');
            });
            
            renderVendors(allVendors);
            
            const sheetProducts = await fetch(`${apiRoot}/Products`).then(res => res.json());
            const firestoreProducts = await loadFirestoreProducts();
            
            allProducts = [...sheetProducts, ...firestoreProducts].filter(p => !suspendedVendors.has(p.vendor_id || p.Vendor_ID));
            
            renderStories(allProducts, globalPhoneBook);
            
            const featured = [];
            const normal = [];
            
            allProducts.forEach(p => {
                if ((p.status || p.Status) !== "Sold") { 
                    if (p.is_featured === "true") featured.push(p);
                    else normal.push(p);
                }
            });

            const displayList = [...featured, ...shuffle(normal)].slice(0, 15);
            renderItems(displayList); 
            loadRecentItems();

        } catch (err) { console.error("Init Error:", err); }
    }

    async function loadFirestoreProducts() {
        try {
            const q = query(collection(db, "products")); 
            const snapshot = await getDocs(q);
            return snapshot.docs.map(doc => ({
                id: doc.id, // ✅ Capture unique ID
                ...doc.data()
            }));
        } catch(e) { return []; }
    }

    window.toggleSave = async function(id, name, price, image, vendor) {
        const user = auth.currentUser;
        if (!user) { document.getElementById('login-modal').style.display = 'flex'; return; }
        const btn = document.getElementById(`save-${id}`);
        const icon = btn.querySelector('i');
        const userRef = doc(db, "users", user.uid, "saved_items", id);

        if (savedItemIds.has(id)) {
            savedItemIds.delete(id);
            await deleteDoc(userRef);
        } else {
            savedItemIds.add(id);
            await setDoc(userRef, { product_id: id, name, price, image, vendor, saved_at: new Date() });
        }
        updateHeartIcons(); // ✅ Update visual instantly
    };

    function updateHeartIcons() {
        document.querySelectorAll('.save-btn').forEach(btn => {
            const id = btn.id.replace('save-', '');
            const icon = btn.querySelector('i');
            if (savedItemIds.has(id)) {
                icon.classList.replace('far', 'fas');
                icon.style.color = '#ff4757';
            } else {
                icon.classList.replace('fas', 'far');
                icon.style.color = '#777';
            }
        });
    }

    window.viewProduct = function(name, price, desc, img, phone, category) {
        document.getElementById('pm-title').innerText = name;
        document.getElementById('pm-price').innerText = price;
        document.getElementById('pm-desc').innerText = desc || "No description provided.";
        document.getElementById('pm-img').src = img;
        document.getElementById('pm-btn').href = `https://wa.me/${phone}?text=${encodeURIComponent(`Hi, I saw "${name}" on AFIT Market. Is it available?`)}`;
        
        const similarWrapper = document.getElementById('similar-wrapper');
        const similarGrid = document.getElementById('pm-similar-grid');
        similarGrid.innerHTML = "";

        if (category && allProducts.length > 0) {
            const similarItems = allProducts.filter(p => (p.category || p.Category) === category && (p.name || p.Name) !== name);
            const picked = similarItems.sort(() => 0.5 - Math.random()).slice(0, 3);

            if (picked.length > 0) {
                similarWrapper.style.display = 'block';
                picked.forEach(p => {
                    const sName = p.name || p.Name;
                    const sImg = (p.image || p.Image).startsWith('http') ? (p.image || p.Image) : `img/${p.image || p.Image}`;
                    const safeName = sName.replace(/'/g, "\\'");
                    const safeDesc = (p.description || "").replace(/'/g, "\\'").replace(/\n/g, " ");

                    similarGrid.innerHTML += `
                    <div class="sim-card" onclick="viewProduct('${safeName}', '${p.price || p.Price}', '${safeDesc}', '${sImg}', '${globalPhoneBook[p.vendor_id || p.Vendor_ID]}', '${category}')">
                        <img src="${sImg}" class="sim-img" onerror="this.src='img/logo-blue.png'">
                        <div class="sim-price">${p.price || p.Price}</div>
                    </div>`;
                });
            } else { similarWrapper.style.display = 'none'; }
        }
        document.getElementById('product-modal').style.display = 'flex';
    };

    window.closeProductModal = function() {
        document.getElementById('product-modal').style.display = 'none';
    };

    window.addToHistory = function(id, name, price, image, vendor) {
        let history = JSON.parse(localStorage.getItem('adm_history')) || [];
        history = history.filter(item => item.id !== id);
        history.unshift({ id, name, price, image, vendor, seenAt: Date.now() });
        if(history.length > 6) history.pop();
        localStorage.setItem('adm_history', JSON.stringify(history));
    };

    function loadRecentItems() {
        let history = JSON.parse(localStorage.getItem('adm_history')) || [];
        const container = document.getElementById('recent-grid');
        const section = document.getElementById('recent-section');
        const TEN_MINUTES = 10 * 60 * 1000;

        history = history.filter(item => (Date.now() - (item.seenAt || 0)) < TEN_MINUTES && globalPhoneBook[item.vendor]);
        localStorage.setItem('adm_history', JSON.stringify(history));

        if(history.length > 0 && container) {
            section.style.display = 'block';
            container.innerHTML = "";
            history.forEach(p => {
                const img = p.image.startsWith('http') ? p.image : `img/${p.image}`;
                const safeName = p.name.replace(/'/g, "\\'");
                container.innerHTML += `
                <div class="ad-card" style="min-width: 140px;"> 
                    <img class="ad-img" src="${img}" onerror="this.src='img/logo-blue.png'" onclick="viewProduct('${safeName}', '${p.price}', '', '${img}', '${globalPhoneBook[p.vendor]}', '')">
                    <div class="ad-info">
                        <div class="ad-price" style="font-size:12px;">${p.price}</div>
                        <div class="ad-title" style="font-size:11px;">${p.name}</div>
                        <a href="#" class="chat-btn" style="padding:4px 10px; font-size:10px;">Get</a>
                    </div>
                </div>`;
            });
        } else if(section) { section.style.display = 'none'; }
    }

    function renderItems(data) {
        const itemGrid = document.getElementById("home-items-grid");
        if(!itemGrid) return;
        itemGrid.innerHTML = ""; 
        data.forEach(p => {
            const pID = p.id || (p.vendor_id + "-" + p.name).replace(/\s+/g, '-').toLowerCase(); // ✅ Use Unique ID
            const isSaved = savedItemIds.has(pID);
            const heartColor = isSaved ? '#ff4757' : '#777';
            const heartClass = isSaved ? 'fas' : 'far';
            const isSold = (p.status || p.Status) === "Sold";
            const isFeatured = p.is_featured === "true";
            const img = (p.image || p.Image).startsWith('http') ? (p.image || p.Image) : `img/${p.image || p.Image}`;
            const safeName = (p.name || p.Name).replace(/'/g, "\\'");
            const safeDesc = (p.description || p.Description || "").replace(/'/g, "\\'").replace(/\n/g, " ");

            let badge = isSold ? '<span style="background:red; color:white; font-size:9px; padding:2px 5px; position:absolute; top:10px; left:10px; border-radius:4px; z-index:10;">SOLD</span>' : 
                        isFeatured ? '<span style="background:#f1c40f; color:white; font-size:9px; padding:2px 5px; position:absolute; top:10px; left:10px; border-radius:4px; z-index:10; font-weight:bold;">⭐ Sponsored</span>' : '';

            itemGrid.innerHTML += `
            <div class="ad-card" style="position:relative; ${isSold ? 'opacity:0.6;' : ''}">
                ${badge}
                <button onclick="toggleSave('${pID}', '${safeName}', '${p.price || p.Price}', '${img}', '${p.vendor_id || p.Vendor_ID}')" 
                        class="save-btn" id="save-${pID}"
                        style="position:absolute; top:10px; right:10px; background:white; border:none; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2); z-index:10;">
                    <i class="${heartClass} fa-heart" style="color:${heartColor};"></i>
                </button>
                <img class="ad-img" src="${img}" onerror="this.src='img/logo-blue.png'" onclick="viewProduct('${safeName}', '${p.price || p.Price}', '${safeDesc}', '${img}', '${globalPhoneBook[p.vendor_id || p.Vendor_ID]}', '${p.category || p.Category}')">
                <div class="ad-info">
                    <div class="ad-price">${p.price || p.Price}</div>
                    <div class="ad-title">${p.name || p.Name}</div>
                    <a href="#" class="chat-btn" style="${isSold ? 'background:#777; pointer-events:none;' : ''}">${isSold ? 'Sold' : 'Get'}</a>
                </div>
            </div>`;
        });
    }

    function shuffle(array) { return array.sort(() => 0.5 - Math.random()); }
    function loadAds() { /* Ads logic */ }
    function setupMainSearch() { /* Search logic */ }
    function renderVendors(data) { /* Vendor logic */ }
    function renderStories(data, book) { /* Stories logic */ }

</script>

</body>
</html>
